/* ===== Ventas ===== */
let ventaTab = 'activas',
  ventaSort = 'fecha';

function fmtPrice(n) {
  if (n == null || !isFinite(n)) return '—';
  const v = Math.round(n * 100) / 100;
  const str = Number.isInteger(v) ? String(v) : v.toFixed(2);
  return str.replace('.', ',') + ' €'
}

function monthDiff(fromTs, toTs) {
  const a = new Date(fromTs),
    b = new Date(toTs);
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth())
}

function scrVentas() {
  const activas = state.plants.filter(p => p.forSale);
  const vendidas = (state.sales || []).slice();
  if (ventaSort === 'precio') vendidas.sort((a, b) => (b.price || 0) - (a.price || 0));
  else vendidas.sort((a, b) => (b.tsSold || 0) - (a.tsSold || 0));
  const totalVendido = vendidas.reduce((a, s) => a + (s.price || 0), 0);
  const mesActual = vendidas.filter(s => sameMonth(s.dateSold)).reduce((a, s) => a + (s.price || 0), 0);
  const pmap = monthlyProfitMap();
  const curKey = today().slice(0, 7);
  const cur = pmap[curKey] || { income: 0, expense: 0 };
  const beneficioMes = cur.income - cur.expense;
  const totalGastosAll = Object.values(pmap).reduce((a, m) => a + m.expense, 0);
  const beneficioTotal = totalVendido - totalGastosAll;
  $('#screen').innerHTML = `<div class="lead-label">Inicio · Ventas</div><div class="s-title">Ventas</div><div class="s-sub">Todo lo que está o ha estado a la venta, de un vistazo</div>
  <div class="grid2" style="margin-bottom:13px">
    <div class="card hero-card"><div class="lead-label" style="margin:0 0 8px">Dinero ganado</div><div style="font-weight:800;font-size:24px;letter-spacing:-.6px">${fmtPrice(totalVendido)}</div>${mesActual?`<div class="mini" style="margin-top:4px">+${fmtPrice(mesActual)} este mes</div>`:''}</div>
    <div class="card hero-card"><div class="lead-label" style="margin:0 0 8px">Beneficio real</div><div style="font-weight:800;font-size:24px;letter-spacing:-.6px;color:${beneficioTotal>=0?'var(--good)':'var(--bad)'}">${beneficioTotal>=0?'+':''}${fmtPrice(beneficioTotal)}</div><div class="mini" style="margin-top:4px;color:${beneficioMes>=0?'var(--good)':'var(--bad)'}">${beneficioMes>=0?'+':''}${fmtPrice(beneficioMes)} este mes</div></div>
  </div>
  <div class="grid2" style="margin-bottom:13px">
    ${tile('En venta',activas.length,"J.setVentaTab('activas')",activas.length?'disponibles':'ninguna ahora','')}
    ${tile('Vendidas',vendidas.length,"J.setVentaTab('vendidas')",vendidas.length?'en Memoria':'aún ninguna','good')}</div>
  <div class="tabs"><div class="tab ${ventaTab==='activas'?'on':''}" onclick="J.setVentaTab('activas')">${ic('bag',14)} En venta</div><div class="tab ${ventaTab==='vendidas'?'on':''}" onclick="J.setVentaTab('vendidas')">${ic('grave',14)} Memoria</div><div class="tab ${ventaTab==='gastos'?'on':''}" onclick="J.setVentaTab('gastos')">${ic('chart',14)} Gastos</div></div>
  ${ventaTab==='activas'?ventaActivasBody(activas):ventaTab==='gastos'?ventaGastosBody():ventaVendidasBody(vendidas,totalVendido)}`
}

function ventaActivasBody(activas) {

      <div class="field" style="margin:9px 0 0"><label>Precio (€)</label><input type="number" min="0" step="0.01" class="inp" value="${p.salePrice!=null?p.salePrice:''}" placeholder="0.00" onchange="J.setSalePrice('${p.id}',this.value)"></div>
      <div class="row" style="margin-top:9px"><button class="btn btn-soft btn-sm" onclick="J.openPlant('${p.id}')">${ic('eye',14)} Ver ficha</button><button class="btn btn-primary btn-sm" onclick="J.sellPlant('${p.id}')">${ic('bag',14)} Marcar vendida</button></div>
    </div></div>`

function ventaVendidasBody(vendidas, total) {
  if (!vendidas.length) return emptyBox('grave', 'Aún no hay ventas en la Memoria', 'Cuando marques una planta como vendida, quedará aquí guardada para siempre: su información, su fecha de venta y su precio final.');
  staggerReset();
  const sortSel = `<select class="sortsel" onchange="J.setVentaSort(this.value)"><option value="fecha" ${ventaSort==='fecha'?'selected':''}>Más recientes</option><option value="precio" ${ventaSort==='precio'?'selected':''}>Mayor precio</option></select>`;
  return `${salesChart(vendidas)}${salesYearBreakdown(vendidas)}
  <div class="group-h line" style="display:flex;align-items:center;justify-content:space-between"><span>${ic('grave',13)} Memoria · plantas vendidas</span></div>
  <div class="mini" style="margin:-2px 2px 12px">Estas plantas ya no forman parte de tu colección activa, pero su historial se conserva aquí para siempre.</div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px">${sortSel}</div>
  <div class="grid2">${vendidas.map(s=>stagger(soldCard(s))).join('')}</div>`
}

function soldCard(s) {
  return `<div class="sold" onclick="J.openSaleDetail('${s.id}')"><div class="badge">${ic('bag',16)}</div><div class="pic">${iconHTML({iconId:s.iconId||'base',stage:s.stage},56)}</div><div class="nm">${esc(s.name||'Sin nombre')}</div><div class="dt">${fmtDate(s.dateSold)}</div><div class="price">${fmtPrice(s.price)}</div></div>`
}

function salesChart(vendidas) {
  if (!vendidas.length) return '';
  const end = new Date(),
    nb = 8,
    buckets = new Array(nb).fill(0),
    labels = [];
  for (let i = 0; i < nb; i++) {
    const d = new Date(end.getFullYear(), end.getMonth() - (nb - 1 - i), 1);
    labels.push(d.toLocaleDateString('es-ES', { month: 'short' }))
  }
  vendidas.forEach(s => {
    const t = s.tsSold || new Date((s.dateSold || today()) + 'T12:00').getTime();
    const mAgo = monthDiff(t, end.getTime());
    const idx = nb - 1 - mAgo;
    if (idx >= 0 && idx < nb) buckets[idx] += (s.price || 0)
  });
  const max = Math.max(1, ...buckets),
    W = 320,
    H = 126,
    pad = 10,
    bw = (W - pad * 2) / nb;
  let bars = '';
  for (let i = 0; i < nb; i++) {
    const bh = buckets[i] / max * (H - 44),
      x = pad + i * bw + bw * 0.22,
      y = H - 26 - bh,
      w = bw * 0.56,
      hot = i === nb - 1 && buckets[i] > 0;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(bh,3).toFixed(1)}" rx="5" fill="${hot?'url(#shot)':'url(#scool)'}" ${hot?'filter="url(#sglow)"':''}/>`;
    if (buckets[i] > 0) bars += `<text x="${(x+w/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="9" fill="${hot?'#6A4FBE':'#A99BC8'}" font-weight="${hot?'800':'600'}" text-anchor="middle">${fmtPrice(buckets[i])}</text>`;
    bars += `<text x="${(x+w/2).toFixed(1)}" y="${H-8}" font-size="8.5" fill="#A99BC8" text-anchor="middle">${labels[i]}</text>`
  }
  return `<div class="card" style="margin-bottom:13px"><div class="lead-label" style="margin:0 0 2px">Por mes</div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px"><div style="font-weight:800;font-size:18px;letter-spacing:-.3px">Ingresos por venta</div></div>
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs>
      <linearGradient id="scool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8B9EE"/><stop offset="1" stop-color="#E6DEF6"/></linearGradient>
      <linearGradient id="shot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9277D6"/><stop offset="1" stop-color="#6A4FBE"/></linearGradient>
      <filter id="sglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <line x1="${pad}" y1="${H-26}" x2="${W-pad}" y2="${H-26}" stroke="#EBE4F7" stroke-width="1"/>${bars}</svg></div></div>`
}

function salesYearBreakdown(vendidas) {
  const byYear = {};
  vendidas.forEach(s => {
    const y = (s.dateSold || '').slice(0, 4) || String(new Date(s.tsSold || Date.now()).getFullYear());
    const m = s.dateSold ? (parseInt(s.dateSold.slice(5, 7), 10) - 1) : new Date(s.tsSold || Date.now()).getMonth();
    byYear[y] = byYear[y] || { total: 0, months: new Array(12).fill(0) };
    byYear[y].total += (s.price || 0);
    if (m >= 0 && m < 12) byYear[y].months[m] += (s.price || 0)
  });
  const years = Object.keys(byYear).sort((a, b) => b - a);
  if (!years.length) return '';
  const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  return `<div class="group-h line">Resumen por año</div>` + years.map(y => {
    const yr = byYear[y];
    const monthLines = yr.months.map((v, i) => v > 0 ? `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px"><span class="mini">${MESES[i]}</span><b>${fmtPrice(v)}</b></div>` : '').join('');
    return `<div class="card" style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:800;font-size:16px">${y}</div><div style="font-weight:800;color:var(--accent3)">${fmtPrice(yr.total)}</div></div>${monthLines?`<div style="margin-top:6px;border-top:1px solid var(--line);padding-top:4px">${monthLines}</div>`:''}</div>`
  }).join('')
}

function setVentaTab(t) {
  ventaTab = t;
  scrVentas()
}

function setVentaSort(v) {
  ventaSort = v;
  scrVentas()
}

/* ===== Gastos y beneficio real ===== */
function plantCostEntries() {
  const list = [];
  state.plants.forEach(p => {
    if (p.cost != null && p.acquired) list.push({ date: p.acquired, amount: p.cost, label: p.name || 'Planta' })
  });
  (state.sales || []).forEach(s => {
    if (s.cost != null && s.acquired) list.push({ date: s.acquired, amount: s.cost, label: s.name || 'Planta' })
  });
  return list
}

function monthlyProfitMap() {
  const map = {};
  const touch = k => map[k] = map[k] || { income: 0, expense: 0 };
  (state.sales || []).forEach(s => {
    const k = (s.dateSold || '').slice(0, 7);
    if (!k) return;
    touch(k).income += (s.price || 0)
  });
  (state.expenses || []).forEach(e => {
    const k = (e.date || '').slice(0, 7);
    if (!k) return;
    touch(k).expense += (e.amount || 0)
  });
  plantCostEntries().forEach(e => {
    const k = (e.date || '').slice(0, 7);
    if (!k) return;
    touch(k).expense += (e.amount || 0)
  });
  return map
}

function ventaGastosBody() {
  const list = (state.expenses || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const totalGastos = list.reduce((a, e) => a + (e.amount || 0), 0);
  const totalPlantas = plantCostEntries().reduce((a, e) => a + (e.amount || 0), 0);
  staggerReset();
  return `<div class="card" style="margin-bottom:13px"><div class="lead-label" style="margin:0 0 4px">Gastos generales</div><div style="font-weight:800;font-size:26px;letter-spacing:-.6px">${fmtPrice(totalGastos)}</div><div class="mini" style="margin-top:5px">Además llevas gastados ${fmtPrice(totalPlantas)} en comprar plantas (el precio de compra que pones en la ficha de cada una) — no hace falta que los anotes también aquí.</div></div>
  <button class="btn btn-soft btn-block" style="margin-bottom:14px" onclick="J.addExpense()">${ic('plus',15)} Añadir gasto (sustrato, semillas, macetas...)</button>
  ${profitYearBreakdown()}
  ${list.length?list.map(e=>stagger(expenseRow(e))).join(''):emptyBox('bag','Sin gastos generales todavía','Sustrato, semillas, macetas, fertilizante... todo lo que compres para tus plantas puedes anotarlo aquí.')}`
}

function expenseRow(e) {
  return `<div class="card list-row"><div class="grow"><div style="font-weight:800">${esc(e.concept)}</div><div class="mini" style="margin-top:2px">${ic('calendar',11)} ${fmtDate(e.date)}</div></div><div style="font-weight:800;color:var(--bad)">-${fmtPrice(e.amount)}</div><span class="icon-btn" onclick="J.delExpense('${e.id}')">${ic('trash',16)}</span></div>`
}

function profitYearBreakdown() {
  const pmap = monthlyProfitMap();
  const keys = Object.keys(pmap);
  if (!keys.length) return '';
  const byYear = {};
  keys.forEach(k => {
    const y = k.slice(0, 4),
      m = parseInt(k.slice(5, 7), 10) - 1;
    byYear[y] = byYear[y] || { total: 0, months: new Array(12).fill(null) };
    const net = pmap[k].income - pmap[k].expense;
    byYear[y].total += net;
    if (m >= 0 && m < 12) byYear[y].months[m] = net
  });
  const years = Object.keys(byYear).sort((a, b) => b - a);
  const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  return `<div class="group-h line">Beneficio real por mes</div>` + years.map(y => {
    const yr = byYear[y];
    const lines = yr.months.map((v, i) => v != null ? `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px"><span class="mini">${MESES[i]}</span><b style="color:${v>=0?'var(--good)':'var(--bad)'}">${v>=0?'+':''}${fmtPrice(v)}</b></div>` : '').join('');
    return `<div class="card" style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:800;font-size:16px">${y}</div><div style="font-weight:800;color:${yr.total>=0?'var(--good)':'var(--bad)'}">${yr.total>=0?'+':''}${fmtPrice(yr.total)}</div></div><div style="margin-top:6px;border-top:1px solid var(--line);padding-top:4px">${lines}</div></div>`
  }).join('')
}

function addExpense() {
  inputModal("Nuevo gasto", [{
    id: 'concept',
    label: 'Concepto (ej: Sustrato, semillas...)',
    placeholder: 'Sustrato universal'
  }, {
    id: 'amount',
    label: 'Importe (€)',
    type: 'number'
  }, {
    id: 'date',
    label: 'Fecha',
    type: 'date',
    value: today()
  }], v => {
    if (!v.concept) return;
    const n = parseFloat(v.amount);
    state.expenses = state.expenses || [];
    state.expenses.unshift({
      id: uid(),
      concept: v.concept,
      amount: isFinite(n) ? n : 0,
      date: v.date || today()
    });
    save();
    scrVentas();
    toast("Gasto añadido")
  })
}

function delExpense(id) {
  confirmModal("Eliminar gasto", "¿Eliminar este gasto? No se puede deshacer.", () => {
    state.expenses = (state.expenses || []).filter(x => x.id !== id);
    save();
    closeModal2();
    scrVentas()
  }, true)
}

function setSalePrice(id, v) {
  const p = state.plants.find(x => x.id === id);
  if (!p) return;
  const n = parseFloat(v);
  p.salePrice = (v === '' || !isFinite(n)) ? null : n;
  save()
}

function sellPlant(id) {
  const p = state.plants.find(x => x.id === id);
  if (!p) return;
  openModal(`<h3>Marcar como vendida</h3><div class="mini" style="margin-bottom:14px">${esc(p.name)} pasará al historial de ventas. El precio quedará fijado y no se podrá modificar después.</div>
  <div class="field"><label>Precio final (€)</label><input id="sale_price" type="number" min="0" step="0.01" class="inp" value="${p.salePrice!=null?p.salePrice:''}" placeholder="0.00"></div>
  <button class="btn btn-primary btn-block" onclick="J.confirmSell('${id}')">Confirmar venta</button>`)
}

function confirmSell(id) {
  const i = state.plants.findIndex(x => x.id === id);
  if (i < 0) {
    closeModal();
    return
  }
  const p = state.plants[i];
  const priceEl = $('#sale_price');
  const price = (priceEl && priceEl.value !== '') ? (parseFloat(priceEl.value) || 0) : (p.salePrice || 0);
  state.sales = state.sales || [];
  state.sales.unshift({
    id: uid(),
    plantId: p.id,
    name: p.name,
    iconId: p.iconId || 'base',
    stage: p.stage,
    photos: p.photos || (p.photo ? [{ id: uid(), src: p.photo, ts: Date.now() }] : []),
    photo: p.photo,
    location: p.location,
    origin: p.origin,
    acquired: p.acquired,
    notes: p.notes,
    price: price,
    cost: p.cost,
    dateSold: today(),
    tsSold: Date.now()
  });
  state.plants.splice(i, 1);
  save();
  closeModal();
  toast("Planta marcada como vendida");
  show('ventas')
}

function openSaleDetail(id) {
  const s = (state.sales || []).find(x => x.id === id);
  if (!s) return;
  const photos = (s.photos || []).slice().sort((a, b) => b.ts - a.ts);
  openModal(`<div class="lead-label" style="text-align:center">${ic('grave',12)} Memoria de ventas</div>
  <div style="text-align:center;margin-bottom:6px">${iconHTML({iconId:s.iconId||'base',stage:s.stage},96)}</div>
  <h3 style="text-align:center">${esc(s.name||'Sin nombre')}</h3>
  <div style="text-align:center;margin:-10px 0 16px"><span class="statpill good">${ic('bag',12)} Vendida por ${fmtPrice(s.price)}</span></div>
  <div class="grid2">${(function(l,v){return `<div class="field"><label>${l}</label><div class="val">${v||'—'}</div></div>`})('Precio final',fmtPrice(s.price))}${(function(l,v){return `<div class="field"><label>${l}</label><div class="val">${v||'—'}</div></div>`})('Fecha de venta',fmtDate(s.dateSold))}</div>
  ${s.cost!=null?(function(l,v){return `<div class="field"><label>${l}</label><div class="val">${v}</div></div>`})('Beneficio de esta venta',fmtPrice(s.price-s.cost)+` <span class="mini">(costó ${fmtPrice(s.cost)})</span>`):''}
  <div class="grid2">${(function(l,v){return `<div class="field"><label>${l}</label><div class="val">${v||'—'}</div></div>`})('Ubicación',esc(s.location))}${(function(l,v){return `<div class="field"><label>${l}</label><div class="val">${v||'—'}</div></div>`})('Adquisición',fmtDate(s.acquired))}</div>
  ${s.notes?`<div class="field"><label>Notas</label><div class="val" style="font-weight:500">${esc(s.notes)}</div></div>`:''}
  ${photos.length?`<div class="field"><label>Fotografías</label><div class="photo-grid">${photos.map(ph=>`<div class="photo-thumb"><img src="${ph.src}"><div class="photo-thumb-dt">${fmtDateTime(ph.ts)}</div></div>`).join('')}</div></div>`:''}
  <button class="btn btn-ghost btn-block" style="margin-top:6px;color:var(--bad)" onclick="J.removeSale('${id}')">${ic('trash',16)} Eliminar del historial</button>`)
}

function removeSale(id) {
  confirmModal("Eliminar venta", "¿Eliminar este registro del historial de ventas para siempre? No se puede deshacer.", () => {
    state.sales = (state.sales || []).filter(x => x.id !== id);
    save();
    closeModal2();
    closeModal();
    toast("Registro eliminado");
    show('ventas')
  }, true)
}

function gardenIconHTML(key, size) {
  const src = GARDEN_IMAGES[key];
  if (src) return `<img src="${src}" style="width:${size}px;height:${size}px;object-fit:contain;display:block" alt="">`;
  return ic(key, size)
}

const ROWH = 216;
const GARDEN_ICONS = ['gCasa', 'gHuerto', 'gTerraza', 'gBalcon', 'gInterior', 'gExterior'];
const GARDEN_ICON_NAMES = {
  gCasa: 'Casa',
  gHuerto: 'Huerto',
  gTerraza: 'Terraza',
  gBalcon: 'Balcón',
  gInterior: 'Interior',
  gExterior: 'Exterior'
};
let _newGardenIcon = 'gCasa',
  _editGardenIcon = 'gCasa';

function scrJardines() {
  const n = gardens.length + 1;
  const xs = i => i % 2 === 0 ? 25 : 75;
  let pathD = `M ${xs(0)} ${ROWH/2}`;
  for (let i = 1; i < n; i++) {
    const y0 = (i - 1) * ROWH + ROWH / 2,
      y1 = i * ROWH + ROWH / 2,
      midY = (y0 + y1) / 2;
    pathD += ` C ${xs(i-1)} ${midY}, ${xs(i)} ${midY}, ${xs(i)} ${y1}`
  }
  let dots = '';
  for (let i = 1; i < n; i++) {
    const y0 = (i - 1) * ROWH + ROWH / 2,
      y1 = i * ROWH + ROWH / 2;
    dots += `<circle cx="${(xs(i-1)+xs(i))/2}" cy="${(y0+y1)/2}" r="1.1" fill="var(--soft)"/>`
  }
  const rows = gardens.map((g, i) => jardinRow(g, i)).join('') + addGardenRow(gardens.length);
  $('#screen').innerHTML = `<div class="jhead"><button class="jback" onclick="J.show('inicio')" aria-label="Volver">${ic('back',20)}</button><div class="jtitle">Mis jardines</div></div>
  <div class="jwrap"><svg class="jpath" viewBox="0 0 100 ${n*ROWH}" preserveAspectRatio="none"><path d="${pathD}" fill="none" stroke="var(--line)" stroke-width="1.3" vector-effect="non-scaling-stroke"/>${dots}</svg>${rows}</div>`
}

const GARDEN_ICON_SIZE = 110;

function jardinRow(g, i) {
  const side = i % 2 === 0 ? 'l' : 'r';
  const icon = GARDEN_ICONS.includes(g.icon) ? g.icon : 'gCasa';
  return `<div class="jrow2 side-${side}"><div class="jnode" onclick="J.enterGarden('${g.id}')">${ic('arrowRight',18)}</div>
    <div class="jinfo"><div class="jicon" onclick="J.enterGarden('${g.id}')">${gardenIconHTML(icon,GARDEN_ICON_SIZE)}</div><div class="jname" onclick="J.enterGarden('${g.id}')">${esc(g.name)}</div></div></div>`
}

function addGardenRow(i) {
  const side = i % 2 === 0 ? 'l' : 'r';
  return `<div class="jrow2 side-${side}"><div class="jnode jnode-add" onclick="J.openCreateGarden()">${ic('plus',20)}</div>
    <div class="jinfo" onclick="J.openCreateGarden()"><div class="jicon">${ic('sprout',GARDEN_ICON_SIZE)}</div><div class="jname">Añadir jardín</div></div></div>`
}

function gardenIconCells(selected, mode) {
  return GARDEN_ICONS.map(k => `<div class="phase ${selected===k?'on':''}" style="min-width:84px" onclick="J.pickGardenIcon('${mode}','${k}')"><div style="width:58px;height:58px;margin:0 auto;display:grid;place-items:center;color:var(--accent3)">${gardenIconHTML(k,52)}</div><div class="n">${GARDEN_ICON_NAMES[k]}</div></div>`).join('')
}

function pickGardenIcon(mode, k) {
  if (mode === 'new') {
    _newGardenIcon = k;
    const el = $('#ngIcons');
    if (el) el.innerHTML = gardenIconCells(k, 'new')
  } else {
    _editGardenIcon = k;
    const el = $('#egIcons');
    if (el) el.innerHTML = gardenIconCells(k, 'edit')
  }
}

function openCreateGarden() {
  _newGardenIcon = 'gCasa';
  openModal2(`<h3>Nuevo jardín</h3>
    <div class="field"><label>Nombre</label><input id="ng_name" class="inp" placeholder="Ej: Huerto de mamá"></div>
    <div class="field"><label>Dibujo</label><div class="phases" style="flex-wrap:wrap" id="ngIcons">${gardenIconCells('gCasa','new')}</div></div>
    <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="J.confirmCreateGarden()">Crear jardín</button>`)
}

function confirmCreateGarden() {
  const nameEl = $('#ng_name');
  const name = nameEl ? nameEl.value.trim() : '';
  if (!name) {
    toast("Ponle un nombre a tu jardín", "bad");
    return
  }
  const id = uid();
  gardens.push({
    id: id,
    name: name,
    icon: _newGardenIcon || 'gCasa'
  });
  saveGardens();
  closeModal2();
  enterGarden(id)
}

function editGardenPrompt(id) {
  const g = gardens.find(x => x.id === id);
  if (!g) return;
  _editGardenIcon = GARDEN_ICONS.includes(g.icon) ? g.icon : 'gCasa';
  openModal2(`<h3>Editar jardín</h3>
    <div class="field"><label>Nombre</label><input id="eg_name" class="inp" value="${esc(g.name)}"></div>
    <div class="field"><label>Dibujo</label><div class="phases" style="flex-wrap:wrap" id="egIcons">${gardenIconCells(_editGardenIcon,'edit')}</div></div>
    <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="J.saveGardenEdit('${id}')">Guardar</button>
    ${gardens.length>1?`<button class="btn btn-ghost btn-block" style="margin-top:8px;color:var(--bad)" onclick="J.deleteGardenPrompt('${id}')">${ic('trash',16)} Eliminar este jardín</button>`:''}`)
}

function saveGardenEdit(id) {
  const g = gardens.find(x => x.id === id);
  if (!g) return;
  const nameEl = $('#eg_name');
  const name = nameEl ? nameEl.value.trim() : '';
  if (!name) {
    toast("Ponle un nombre", "bad");
    return
  }
  g.name = name;
  g.icon = _editGardenIcon || g.icon;
  saveGardens();
  closeModal2();
  scrJardines()
}

function deleteGardenPrompt(id) {
  if (gardens.length <= 1) return;
  const g = gardens.find(x => x.id === id);
  if (!g) return;
  confirmModal("Eliminar jardín", "¿Eliminar «" + esc(g.name) + "» y todos sus datos (plantas, ventas, tareas...)? No se puede deshacer.", () => {
    const key = gardenDbKey(id);
    const wasActive = activeGardenId === id;
    gardens = gardens.filter(x => x.id !== id);
    if (wasActive) activeGardenId = gardens[0].id;
    saveGardens();
    idbDel(key).catch(() => {});
    try {
      localStorage.removeItem(id === DEFAULT_GARDEN_ID ? 'josie_v5' : ('josie_v5_' + id))
    } catch (e) {}
    closeModal2();
    if (wasActive) {
      load().then(() => {
        if (!state) state = freshState();
        applyTheme();
        show(gardens.length > 1 ? 'jardines' : 'inicio')
      })
    } else {
      scrJardines()
    }
  }, true)
}

function enterGarden(id) {
  if (id === activeGardenId) {
    show('inicio');
    return
  }
  persistNow().catch(() => {}).then(() => {
    activeGardenId = id;
    saveGardens();
    return load()
  }).then(() => {
    if (!state) state = freshState();
    applyTheme();
    show('inicio')
  })
}

function waterAll() {
  if (!state.plants.length) {
    toast("No tienes plantas", "bad");
    return
  }
  let c = 0;
  state.plants.forEach(p => {
    p.lastWater = today();
    logWater(p, today());
    state.counters.waterTotal++;
    c++
  });
  gain(c * PTS.regar, "Regar todo (" + c + ")");
  recomputeBadges();
  save();
  show('inicio')
}

function reviewAll() {
  if (!state.plants.length) {
    toast("No tienes plantas", "bad");
    return
  }
  const t = today();
  let c = 0;
  state.plants.forEach(p => {
    if (p.lastReview !== t) {
      p.lastReview = t;
      c++
    }
  });
  if (!c) {
    toast("Ya estaban todas revisadas hoy");
    return
  }
  recomputeBadges();
  save();
  toast(c + " revisadas hoy");
  show('inicio')
}

/* modals */
function openModal(h) {
  $('#modal').innerHTML = '<div class="modal-grab"></div><button class="sheet-x" onclick="J.closeModal()" aria-label="Cerrar">' + ic('x', 19) + '</button>' + h;
  $('#overlay').classList.add('on');
  var m = $('#modal');
  if (m) m.scrollTop = 0
}

function closeModal() {
  $('#overlay').classList.remove('on');
  refreshScreen()
}

function openModal2(h) {
  $('#modal2').innerHTML = h;
  $('#overlay2').classList.add('on')
}

function closeModal2() {
  $('#overlay2').classList.remove('on')
}

function confirmModal(title, msg, onYes, danger) {
  window._cy = onYes;
  openModal2(`<h3>${title}</h3><div class="mini" style="margin-bottom:18px;font-size:13.5px">${msg}</div><div class="row"><button class="btn btn-soft" onclick="J.closeModal2()">Cancelar</button><button class="btn ${danger?'btn-bad':'btn-primary'}" onclick="J._cyRun()">Sí, continuar</button></div>`)
}

function _cyRun() {
  const f = window._cy;
  closeModal2();
  if (f) f()
}

function inputModal(title, fields, onSubmit) {
  window._isub = onSubmit;
  window._ifields = fields;
  const body = fields.map(f => `<div class="field"><label>${f.label}</label><input id="im_${f.id}" class="inp" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}"></div>`).join('');
  openModal2(`<h3>${title}</h3>${body}<div class="row"><button class="btn btn-soft" onclick="J.closeModal2()">Cancelar</button><button class="btn btn-primary" onclick="J._isubRun()">Guardar</button></div>`);
  setTimeout(() => {
    const el = $('#im_' + fields[0].id);
    if (el) el.focus()
  }, 250)
}

function _isubRun() {
  const v = {};
  window._ifields.forEach(f => v[f.id] = $('#im_' + f.id).value.trim());
  closeModal2();
  if (window._isub) window._isub(v)
}

function pickFile(cb, accept = "image/*") {
  const i = document.createElement('input');
  i.type = 'file';
  i.accept = accept;
  i.onchange = () => {
    const f = i.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => cb(r.result);
    r.readAsDataURL(f)
  };
  i.click()
}

  }
  openModal(`<h3 style="display:flex;align-items:center;gap:8px">${ic('lock',20)} Panel de administración</h3><div class="mini" style="margin-bottom:14px">Zona privada. Introduce la contraseña.</div><input id="adm_pw" class="inp" type="password" placeholder="Contraseña" style="margin-bottom:14px"><button class="btn btn-primary btn-block" onclick="J.adminCheck()">Entrar</button>`);

}

function adminCheck() {
  if ($('#adm_pw').value === ADMIN_PW) {

}

function admEditItem(cat, id, k, v) {
  const it = state.shop[cat].find(x => x.id === id);

function admToggle(cat, id, k) {
  const it = state.shop[cat].find(x => x.id === id);
  it[k] = !it[k];
  save();
  renderAdmBody()
}

function admDelItem(cat, id) {
  confirmModal("Eliminar artículo", "¿Eliminar este artículo de la tienda?", () => {
    state.shop[cat] = state.shop[cat].filter(x => x.id !== id);

    renderAdmBody()
  }, true)

    renderAdmBody()
  })

      placeholder: 'Ej: Maceta coral'
    }, {

  function applyTheme() {
    const th = state.theme,
      r = document.documentElement.style,
      c = th.colors || {},
      tx = th.text || {};
    ['accent', 'accent2', 'accent3', 'ink', 'bg', 'gold'].forEach(k => {
      if (c[k]) r.setProperty('--' + k, c[k]);
      else r.removeProperty('--' + k)
    });
    r.setProperty('--font-logo', fontVal(th.fonts.logo, "'Hoefler Text','Didot','Bodoni MT',Georgia,serif"));
    r.setProperty('--font-head', fontVal(th.fonts.head, '-apple-system,sans-serif'));
    r.setProperty('--font-body', fontVal(th.fonts.body, '-apple-system,sans-serif'));
    const L = tx.logo || {},
      Hh = tx.head || {},
      B = tx.body || {};
    r.setProperty('--c-logo', L.color || 'var(--accent3)');
    r.setProperty('--w-logo', L.bold ? '700' : '500');
    r.setProperty('--st-logo', L.italic ? 'italic' : 'normal');
    r.setProperty('--c-head', Hh.color || 'var(--ink)');
    r.setProperty('--w-head', Hh.bold ? '800' : '600');
    r.setProperty('--st-head', Hh.italic ? 'italic' : 'normal');
    r.setProperty('--c-body', B.color || 'var(--ink)');
    r.setProperty('--w-body', B.bold ? '600' : '400');
    r.setProperty('--st-body', B.italic ? 'italic' : 'normal');
    Object.entries(th.customFonts || {}).forEach(([k, d]) => {
      const fam = k.split(',')[1];
      if (fam && !document.getElementById('ff-' + fam)) {
        const s = document.createElement('style');
        s.id = 'ff-' + fam;
        s.textContent = `@font-face{font-family:'${fam}';src:url('${d}')}`;
        document.head.appendChild(s)
      }
    });
    $('#logoTxt').textContent = th.appName || 'Josie';
    const li = $('#logoImg');
    if (th.logo) {
      li.src = th.logo;
      li.classList.remove('hidden')
    } else li.classList.add('hidden')
  }

  function tr(s) {
    if (LANG === 'es' || s == null) return s;
    const d = I18N[LANG] || {};
    return (d[s] !== undefined) ? d[s] : s;
  }

  function trMsg(m) {
    if (LANG === 'es' || m == null) return m;
    const d = I18N[LANG] || {};
    if (d[m] !== undefined) return d[m];
    const mm = ('' + m).match(/^([+-]\d+ · )([\s\S]+)$/);
    if (mm && d[mm[2]] !== undefined) return mm[1] + d[mm[2]];
    const mi = ('' + m).match(/^(Insignia: )([\s\S]+)$/);
    if (mi && d[mi[2]] !== undefined) return mi[1] + d[mi[2]];
    return m;
  }
  let _langObs = null;

  function translateTree(root) {
    if (LANG === 'es' || !root) return;
    const d = I18N[LANG] || {};
    try {
      const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      const arr = [];
      let n;
      while (n = w.nextNode()) arr.push(n);
      arr.forEach(tn => {
        const raw = tn.nodeValue;
        const k = raw.trim();
        if (!k) return;
        if (d[k] !== undefined && d[k] !== k) {
          tn.nodeValue = raw.replace(k, d[k]);
        }
      });
      if (root.querySelectorAll) {
        root.querySelectorAll('[placeholder]').forEach(el => {
          const k = (el.getAttribute('placeholder') || '').trim();
          if (d[k] !== undefined) el.setAttribute('placeholder', d[k]);
        });
      }
    } catch (e) {}
  }

  function applyLangAll() {
    if (LANG === 'es') return;
    const tgt = document.body;
    if (_langObs) _langObs.disconnect();
    translateTree(tgt);
    if (_langObs) _langObs.observe(tgt, {
      childList: true,
      subtree: true,
      characterData: true
    });
  }

  function loadLang() {
    try {
      const l = localStorage.getItem('josie_lang');
      if (l === 'es' || l === 'it') return l;
    } catch (e) {}
    return (state && state.profile && state.profile.lang) || 'es';
  }

  function setLang(l) {
    if (l !== 'es' && l !== 'it') l = 'es';
    LANG = l;
    try {
      localStorage.setItem('josie_lang', l)
    } catch (e) {}
    if (state && state.profile) {
      state.profile.lang = l;
      save();
    }
    if (typeof current !== 'undefined' && current) {
      show(current);
    }
    setTimeout(applyLangAll, 30);
  }

  function initLang() {
    LANG = loadLang();
    const tgt = document.body;
    if (!_langObs) {
      _langObs = new MutationObserver(() => {
        if (LANG === 'es') return;
        clearTimeout(window._langT);
        window._langT = setTimeout(applyLangAll, 25);
      });
    }
    applyLangAll();
    if (_langObs) _langObs.observe(tgt, {
      childList: true,
      subtree: true,
      characterData: true
    });
  }

  /* ===== Copia de seguridad (export / import) — segura ===== */
  async function exportBackup() {
    try {
      const gardensData = {};
      for (const g of gardens) {
        if (g.id === activeGardenId) {
          gardensData[g.id] = state
        } else {
          let blob = null;
          try {
            blob = await idbGet(gardenDbKey(g.id))
          } catch (e) {}
          gardensData[g.id] = blob || freshState()
        }
      }
      const payload = {
        __josieMultiGarden: true,
        v: 1,
        registry: {
          gardens: gardens,
          activeId: activeGardenId
        },
        gardens: gardensData
      };
      const data = JSON.stringify(payload);
      const blob = new Blob([data], {
        type: 'application/json'
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const d = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = 'josie-datos-' + d + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        URL.revokeObjectURL(url);
        a.remove();
      }, 900);
      toast("Copia descargada");
    } catch (e) {
      toast("No se pudo exportar", "bad");
    }
  }

  function sanitizeState(o) {
    const out = freshState();
    if (!o || typeof o !== 'object') return out;
    if (o.profile && typeof o.profile === 'object') {
      const P = out.profile;
      const src = o.profile;
      ['name', 'avatar', 'lang'].forEach(k => {
        if (typeof src[k] === 'string' || src[k] === null) P[k] = src[k];
      });
      ['points', 'xp', 'levelIndex', 'streak', 'maxStreak'].forEach(k => {
        if (typeof src[k] === 'number' && isFinite(src[k])) P[k] = src[k];
      });
      if (typeof src.lastLogin === 'string' || src.lastLogin === null) P.lastLogin = src.lastLogin;
      P.locations = Array.isArray(src.locations) ? src.locations.filter(x => typeof x === 'string') : P.locations;
      P.substrates = Array.isArray(src.substrates) ? src.substrates.filter(x => typeof x === 'string') : P.substrates;
      P.badges = Array.isArray(src.badges) ? src.badges.filter(x => typeof x === 'string') : [];
      /* Etiquetas de salud y síntomas (incluye sus colores) — deben sobrevivir a un export/import */
      if (Array.isArray(src.symptoms) && src.symptoms.length) {
        P.symptoms = src.symptoms.map(s => (typeof s === 'string') ? { n: s, c: 'warn' } : { n: String(s.n || ''), c: s.c || '' }).filter(s => s.n)
      }
      if (Array.isArray(src.healthTags) && src.healthTags.length) {
        P.healthTags = src.healthTags.map(t => ({ k: t.k || (t.n || '').toLowerCase().replace(/\s+/g, '-'), n: String(t.n || ''), c: t.c || '' })).filter(t => t.n)
      }
      if (src.pestTag && typeof src.pestTag === 'object') {
        P.pestTag = { n: (typeof src.pestTag.n === 'string' && src.pestTag.n) ? src.pestTag.n : P.pestTag.n, c: typeof src.pestTag.c === 'string' ? src.pestTag.c : P.pestTag.c }
      }
    }
    ['plants', 'tasks', 'incubator', 'cemetery', 'log', 'sales', 'expenses'].forEach(k => {
      out[k] = Array.isArray(o[k]) ? o[k] : [];
    });
    /* Iconos personalizados: se perdían en la restauración; ahora se conservan íntegros */
    out.icons = Array.isArray(o.icons) ? o.icons : [];
    if (o.inventory && typeof o.inventory === 'object') {
      ['macetas', 'plantas', 'fondos', 'marcos'].forEach(c => {
        out.inventory[c] = Array.isArray(o.inventory[c]) ? o.inventory[c].filter(x => typeof x === 'string') : [];
      });
    }
    if (o.shop && typeof o.shop === 'object') out.shop = o.shop;
    if (o.combos && typeof o.combos === 'object') out.combos = o.combos;
    if (o.counters && typeof o.counters === 'object') {
      if (typeof o.counters.waterTotal === 'number') out.counters.waterTotal = o.counters.waterTotal;
      if (typeof o.counters.promoTotal === 'number') out.counters.promoTotal = o.counters.promoTotal;
      if (typeof o.counters.legendaryTotal === 'number') out.counters.legendaryTotal = o.counters.legendaryTotal;
    }
    if (o.theme && typeof o.theme === 'object') out.theme = Object.assign(freshState().theme, o.theme);
    out.v = 5;
    return out;
  }

  function importBackup() {
    pickFile(d => {
      let txt;
      try {
        const b64 = d.split('base64,')[1];
        txt = b64 ? decodeURIComponent(escape(atob(b64))) : decodeURIComponent(d.split(',').slice(1).join(','));
      } catch (e) {
        toast("Archivo no válido", "bad");
        return;
      }
      let parsed;
      try {
        parsed = JSON.parse(txt, (k, v) => k === '__proto__' ? undefined : v);
      } catch (e) {
        toast("Archivo no válido", "bad");
        return;
      }
      if (!parsed || typeof parsed !== 'object') {
        toast("Archivo no válido", "bad");
        return;
      }

      /* Copia con varios jardines (formato nuevo): restaura todos los jardines de golpe */
      if (parsed.__josieMultiGarden && parsed.registry && parsed.gardens && typeof parsed.gardens === 'object') {
        const regGardens = Array.isArray(parsed.registry.gardens) ? parsed.registry.gardens.filter(g => g && g.id && g.name) : [];
        if (!regGardens.length) {
          toast("Archivo no válido", "bad");
          return;
        }
        confirmModal("Restaurar copia", "Esto reemplazará TODOS tus jardines y sus datos por los de la copia de seguridad. No se puede deshacer.", () => {
          (async () => {
            try {
              for (const g of regGardens) {
                const clean = sanitizeState(parsed.gardens[g.id]);
                const prevState = state,
                  prevActive = activeGardenId;
                state = clean;
                activeGardenId = g.id;
                migrate();
                await idbSet(gardenDbKey(g.id), state);
                state = prevState;
                activeGardenId = prevActive
              }
              gardens = regGardens;
              activeGardenId = (parsed.registry.activeId && regGardens.some(g => g.id === parsed.registry.activeId)) ? parsed.registry.activeId : regGardens[0].id;
              await saveGardens();
              await load();
              if (!state) state = freshState();
              applyTheme();
              LANG = loadLang();
              if (state.profile.lang) LANG = state.profile.lang;
              closeModal2();
              closeModal();
              toast("Jardines restaurados");
              show(gardens.length > 1 ? 'jardines' : 'inicio');
              setTimeout(applyLangAll, 40)
            } catch (e) {
              toast("No se pudo restaurar", "bad")
            }
          })()
        }, true);
        return
      }

      /* Copia de un único jardín (formato de versiones anteriores): se restaura sobre el jardín activo */
      if (typeof parsed.profile !== 'object' || !Array.isArray(parsed.plants)) {
        toast("Archivo no válido", "bad");
        return;
      }
      confirmModal("Restaurar copia", "Esto reemplazará TODOS los datos del jardín actual por los de la copia de seguridad. No se puede deshacer.", () => {
        try {
          state = sanitizeState(parsed);
          migrate();
          applyTheme();
          save();
          LANG = loadLang();
          if (state.profile.lang) LANG = state.profile.lang;
          closeModal2();
          closeModal();
          toast("Datos restaurados");
          show('inicio');
          setTimeout(applyLangAll, 40);
        } catch (e) {
          toast("No se pudo restaurar", "bad");
        }
      }, true);
    }, "application/json,.json");
  }

  function refreshUndo() {
    const u = $('#undoPill');
    if (!u) return;
    if (undoStack.length) {
      u.style.display = '';
      u.innerHTML = ic('undo', 15) + '<span>Deshacer</span>'
    } else u.style.display = 'none'
  }

  function pushUndo() {
    try {
      undoStack.push(JSON.stringify(state));
      if (undoStack.length > 12) undoStack.shift()
    } catch (e) {}
    refreshUndo()
  }

  function undo() {
    if (!undoStack.length) {
      toast("Nada que deshacer", "bad");
      return
    }
    let prev;
    try {
      prev = undoStack.pop();
      state = JSON.parse(prev);
      migrate();
      save()
    } catch (e) {
      return
    }
    const ov = $('#overlay').classList.contains('on');
    if (ov && _lastFichaId && state.plants.find(p => p.id === _lastFichaId)) {
      renderFicha(_lastFichaId)
    } else {
      if (ov) closeModal();
      show(current)
    }
    refreshUndo();
    toast("Acción deshecha")
  }
