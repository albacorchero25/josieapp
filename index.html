<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Josie">
<meta name="theme-color" content="#F4F1FB">
<link id="touchIcon" rel="apple-touch-icon">
<link id="maniLink" rel="manifest">
<title>Josie</title>
<style>
:root{
  --bg:#FAF8FE; --bg2:#F2EEFB;
  --accent:#9277D6; --accent2:#B7A4EC; --accent3:#6A4FBE; --soft:#DCD2F2;
  --gold:#C2A24A; --ink:#2E2747; --muted:#8E86A8;
  --glass:rgba(255,255,255,.62); --line:rgba(110,84,192,.11);
  --good:#6BA88C; --warn:#C99A5C; --bad:#C77E96;
  --card:linear-gradient(155deg,rgba(255,255,255,.93),rgba(255,255,255,.60));
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --font-head:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-logo:'Hoefler Text','Didot','Bodoni MT',Georgia,'Times New Roman',serif;
  --radius:26px;
  --sh1:0 1px 3px rgba(80,60,130,.045);
  --sh2:0 16px 44px rgba(98,72,154,.085),0 4px 14px rgba(98,72,154,.04);
  --c-logo:var(--accent3); --w-logo:500; --st-logo:italic;
  --c-head:var(--ink); --w-head:800; --st-head:normal;
  --c-body:var(--ink); --w-body:400; --st-body:normal;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg2);font-family:var(--font-body);overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center}
#phone{width:100%;max-width:440px;min-height:100vh;position:relative;color:var(--c-body);font-weight:var(--w-body);font-style:var(--st-body);
  background:
    radial-gradient(900px 420px at 86% -8%, rgba(146,119,214,.18), transparent 60%),
    radial-gradient(720px 420px at -16% 10%, rgba(183,164,236,.20), transparent 58%),
    radial-gradient(680px 560px at 50% 112%, rgba(160,132,214,.12), transparent 60%),
    linear-gradient(180deg,var(--bg) 0%, #F1ECFB 100%);
  background-attachment:fixed}
body{overflow-x:hidden}
::-webkit-scrollbar{width:0;height:0}
.hidden{display:none!important}
.ic-svg{vertical-align:-.18em;flex:none}

#header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 20px 13px;
  backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
  background:linear-gradient(180deg,rgba(250,248,254,.95),rgba(250,248,254,.16));
  box-shadow:0 16px 24px -20px rgba(98,72,154,.5)}
.logo-wrap{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.logo-img{width:30px;height:30px;border-radius:10px;object-fit:cover;background:rgba(255,255,255,.6);border:1px solid var(--line)}
.logo-txt{font-family:var(--font-logo);font-size:28px;letter-spacing:.5px;color:var(--c-logo);font-weight:var(--w-logo);font-style:var(--st-logo)}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-avatar{width:33px;height:33px;border-radius:50%;cursor:pointer;flex:none;display:grid;place-items:center;color:#fff;border:2px solid #fff;box-shadow:0 4px 12px rgba(139,111,212,.35);background:linear-gradient(135deg,var(--accent),var(--accent2));transition:transform .15s}
.hdr-avatar:active{transform:scale(.9)}
.pill{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.5));
  border:1px solid rgba(255,255,255,.7);padding:8px 13px;border-radius:30px;font-weight:700;font-size:14px;cursor:pointer;
  box-shadow:0 4px 14px rgba(85,58,138,.1),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .15s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill:active{transform:scale(.93)} .pill.flame{color:var(--warn)} .pill.pts{color:var(--accent3)}

#screen{padding:18px 18px 138px;min-height:60vh;will-change:opacity,transform}
@keyframes screenIn{0%{opacity:0;transform:translateY(13px) scale(.985)}100%{opacity:1;transform:none}}
@keyframes screenInL{0%{opacity:0;transform:translateX(28px)}100%{opacity:1;transform:none}}
@keyframes screenInR{0%{opacity:0;transform:translateX(-28px)}100%{opacity:1;transform:none}}
.anim-up{animation:screenIn .46s cubic-bezier(.22,.61,.36,1)}
.anim-l{animation:screenInL .42s cubic-bezier(.22,.61,.36,1)}
.anim-r{animation:screenInR .42s cubic-bezier(.22,.61,.36,1)}
@keyframes cardIn{0%{opacity:0;transform:translateY(10px) scale(.98)}100%{opacity:1;transform:none}}
.stagger{opacity:0;animation:cardIn .4s cubic-bezier(.22,.68,.32,1) forwards}
.card,.plant-card,.grave,.inc-card,.tile{transition:transform .18s cubic-bezier(.3,.7,.4,1),box-shadow .18s}
@media (prefers-reduced-motion: reduce){.stagger,.anim-up,.anim-l,.anim-r{animation:none!important;opacity:1!important}}
.s-title{font-family:var(--font-head);font-size:28px;font-weight:var(--w-head);font-style:var(--st-head);color:var(--c-head);margin:6px 2px 3px;letter-spacing:-.6px}
.s-sub{color:var(--muted);font-size:13.5px;margin:0 2px 18px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.card{background:var(--card);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid rgba(255,255,255,.62);border-radius:var(--radius);padding:17px;box-shadow:var(--sh2);position:relative}
.card::after{content:"";position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.stat{padding:16px 15px;display:flex;flex-direction:column;gap:3px}
.stat.tap{cursor:pointer;transition:transform .15s}.stat.tap:active{transform:scale(.96)}
.stat .v{font-size:28px;font-weight:800;line-height:1;letter-spacing:-1px}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600}
.stat .ic{margin-bottom:7px;color:var(--accent);opacity:.92}
.ring{--p:0;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--accent) calc(var(--p)*1%), rgba(139,111,212,.13) 0)}
.ring .inner{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-weight:800;font-size:19px;color:var(--accent3);box-shadow:inset 0 1px 5px rgba(139,111,212,.16)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:none;
  font-family:var(--font-body);font-weight:700;font-size:14.5px;border-radius:16px;padding:13px 16px;
  transition:transform .14s,filter .2s;user-select:none}
.btn:active{transform:scale(.94);filter:brightness(.96)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;box-shadow:0 10px 26px rgba(106,79,190,.30)}
.btn-soft{background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.5));border:1px solid rgba(255,255,255,.7);color:var(--accent3);box-shadow:var(--sh1);backdrop-filter:blur(10px)}
.btn-ghost{background:transparent;color:var(--muted);font-weight:600}
.btn-bad{background:rgba(196,106,134,.12);color:var(--bad);border:1px solid rgba(196,106,134,.22)}
.btn-block{width:100%}.btn-sm{padding:9px 13px;font-size:13px;border-radius:13px;gap:6px}

#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);z-index:50;display:flex;justify-content:center;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
.nav-pill{display:flex;align-items:center;justify-content:space-between;width:100%;gap:2px;
  background:linear-gradient(180deg,rgba(255,255,255,.84),rgba(255,255,255,.64));
  backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);
  border:1px solid rgba(255,255,255,.72);border-radius:32px;padding:9px 12px;
  box-shadow:0 16px 40px rgba(85,58,138,.22),inset 0 1px 0 rgba(255,255,255,.9)}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:700;padding:4px 0;border-radius:16px;transition:color .25s}
.nav-i svg{transition:transform .25s}.nav-i.active{color:var(--accent3)}.nav-i.active svg{transform:translateY(-1px) scale(1.06)}
.nav-add{flex:none;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 32% 24%,#fff,var(--accent2) 42%,var(--accent) 100%);color:#fff;display:grid;place-items:center;cursor:pointer;margin:0 4px;
  box-shadow:0 11px 26px rgba(139,111,212,.5),inset 0 2px 5px rgba(255,255,255,.65);transition:transform .18s}
.nav-add:active{transform:scale(.88) rotate(90deg)}

.picon{position:relative;border-radius:20px;overflow:hidden;flex:none;background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(197,184,228,.24));box-shadow:inset 0 0 0 1px rgba(139,111,212,.06)}
.picon img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.picon .l-bg{object-fit:cover}.picon .l-pot{width:80%;left:10%;top:auto;bottom:5%;height:auto}
.picon .l-plant{width:68%;left:16%;top:1%;height:74%;object-fit:contain;object-position:bottom}
.picon.legend{box-shadow:inset 0 0 0 2.5px var(--gold),0 0 22px rgba(194,162,74,.45)}

.plant-card{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:12px;cursor:pointer;transition:transform .16s}
.plant-card:active{transform:scale(.985)}.plant-card .pic{width:64px;height:64px}
.pc-body{flex:1;min-width:0}
.pc-name{font-weight:800;font-size:16.5px;display:flex;align-items:center;gap:7px;letter-spacing:-.3px}
.pc-meta{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.pc-meta>span{display:inline-flex;align-items:center;gap:4px}
.pc-actions{position:absolute;top:13px;right:14px;display:flex;gap:12px;align-items:center;color:var(--muted)}
.pc-actions span{cursor:pointer;display:inline-flex}.pc-actions .fav-on{color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(139,111,212,.1);color:var(--accent3)}
.chip.good{background:rgba(92,168,130,.15);color:var(--good)}.chip.warn{background:rgba(208,137,78,.15);color:var(--warn)}
.chip.bad{background:rgba(196,106,134,.15);color:var(--bad)}.chip.gold{background:rgba(194,162,74,.16);color:#8a6f1f}
.group-h{font-weight:800;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:20px 4px 11px;display:flex;align-items:center;gap:7px}
.group-h.line::after{content:"";flex:1;height:1px;background:var(--line)}

.search{width:100%;padding:13px 15px;border-radius:16px;border:1px solid rgba(255,255,255,.6);background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.5));font-family:var(--font-body);font-size:14.5px;color:var(--ink);outline:none;margin-bottom:13px;box-shadow:var(--sh1);backdrop-filter:blur(10px)}
.filters{display:flex;gap:9px;overflow-x:auto;padding-bottom:9px;margin-bottom:4px}
.fil{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:24px;border:1px solid rgba(255,255,255,.7);
  background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.52));font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;
  transition:all .22s;box-shadow:0 4px 14px rgba(85,58,138,.08),inset 0 1px 0 rgba(255,255,255,.85);backdrop-filter:blur(12px)}
.fil.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(139,111,212,.34)}

.tabs{display:flex;gap:5px;background:rgba(139,111,212,.08);border:1px solid var(--line);border-radius:18px;padding:5px;margin:16px 0}
.tab{flex:1;text-align:center;padding:10px 4px;border-radius:13px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .25s}
.tab.on{background:#fff;color:var(--accent3);box-shadow:0 4px 12px rgba(139,111,212,.16)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field .val{font-size:15px;font-weight:600}
input,select,textarea{font-family:var(--font-body);font-size:14.5px;color:var(--ink)}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.78);outline:none;transition:border .2s}
.inp:focus{border-color:var(--accent2)}textarea.inp{resize:vertical;min-height:66px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}

.toggle{position:relative;width:48px;height:28px;border-radius:30px;background:rgba(139,111,212,.2);cursor:pointer;transition:background .25s;flex:none}
.toggle.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .25s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.toggle.on::after{left:23px}
.togrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}

.tagrow{display:flex;flex-wrap:wrap;gap:8px}
.tagsel{padding:8px 14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.65);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .18s}
.tagsel.on{background:var(--accent);color:#fff;border-color:transparent}
.tagsel.on.bad{background:var(--bad)}.tagsel.on.warn{background:var(--warn)}.tagsel.on.good{background:var(--good)}
.tagsel.chosen{box-shadow:0 0 0 2.5px #fff inset,0 0 0 4.5px var(--accent3)}

.phases{display:flex;gap:8px;overflow-x:auto;padding:4px 0 9px}
.phase{flex:none;text-align:center;padding:12px 14px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.62);cursor:pointer;min-width:78px;transition:all .22s;color:var(--accent3)}
.phase.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 7px 18px rgba(139,111,212,.3)}
.phase.on.leg{background:linear-gradient(135deg,#c2a24a,#e0c264);color:#3a2f08}
.phase .e{height:24px;display:flex;align-items:center;justify-content:center}.phase .n{font-size:11px;font-weight:700;margin-top:5px;color:inherit}

.inc-card{display:flex;gap:14px;align-items:center;padding:15px;margin-bottom:12px;cursor:pointer;transition:transform .16s}
.inc-card:active{transform:scale(.985)}
.inc-ic{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;flex:none;background:linear-gradient(160deg,rgba(168,139,224,.22),rgba(92,168,130,.15));border:1px solid var(--line)}
.inc-ic img{width:40px;height:40px;object-fit:contain}
.progress{height:8px;border-radius:6px;background:rgba(139,111,212,.13);overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--accent2));border-radius:6px;transition:width .5s}

.shop-cats{display:flex;gap:9px;overflow-x:auto;margin-bottom:15px;padding-bottom:7px}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.shop-item{padding:13px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.shop-item .pic{width:100px;height:100px}.shop-item .nm{font-weight:700;font-size:13px}.shop-item .pr{font-size:13px;font-weight:800;color:var(--accent3);display:inline-flex;align-items:center;gap:4px}
.owned-badge{font-size:11px;font-weight:800;color:var(--good);display:inline-flex;align-items:center;gap:4px}

.grave{position:relative;width:100%;padding:24px 14px 16px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(197,184,228,.18));border:1px solid var(--line);border-radius:100px 100px 16px 16px;cursor:pointer;box-shadow:var(--sh1)}
.grave .pic{width:56px;height:56px;margin:0 auto 9px;opacity:.82;filter:grayscale(.4)}
.grave .nm{font-weight:800;font-size:14px}.grave .dt{font-size:11px;color:var(--muted);margin-top:3px}
.grave .cross{color:var(--soft);margin-bottom:6px;display:flex;justify-content:center}
.sold{position:relative;width:100%;padding:24px 14px 16px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.68),rgba(214,182,110,.16));border:1px solid var(--line);border-radius:100px 100px 16px 16px;cursor:pointer;box-shadow:var(--sh1)}
.sold .badge{color:var(--gold);margin-bottom:6px;display:flex;justify-content:center}
.sold .pic{width:56px;height:56px;margin:0 auto 9px}
.sold .nm{font-weight:800;font-size:14px}
.sold .dt{font-size:11px;color:var(--muted);margin-top:3px}
.sold .price{font-size:13.5px;font-weight:800;color:var(--good);margin-top:5px}

/* Mis jardines */
.jhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.jback{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.7);color:var(--accent3);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--sh1)}
.jback:active{transform:scale(.92)}
.jtitle{font-family:var(--f-head);font-size:23px;font-weight:800;color:var(--c-head);letter-spacing:-.3px}
.jwrap{position:relative}
.jpath{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.jrow2{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;height:216px;gap:6px}
.jrow2.side-r{direction:rtl}
.jrow2.side-r>*{direction:ltr}
.jnode{width:56px;height:56px;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 32% 26%,#fff,var(--accent2) 42%,var(--accent) 100%);box-shadow:0 10px 20px rgba(139,111,212,.4),inset 0 2px 4px rgba(255,255,255,.65);display:grid;place-items:center;color:#fff;cursor:pointer;transition:transform .15s}
.jnode:active{transform:scale(.92)}
.jnode-add{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(230,222,246,.92));box-shadow:0 10px 22px rgba(139,111,212,.22),inset 0 2px 5px rgba(255,255,255,.85);color:var(--accent3);border:2px dashed var(--soft)}
.jrow2.side-r .jnode svg{transform:scaleX(-1)}
.jinfo{position:relative;text-align:center;cursor:pointer}
.jicon{color:var(--accent3);display:flex;justify-content:center;margin-bottom:6px}
.jname{font-weight:700;font-size:14.5px;color:var(--ink)}

.badge-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.badge{padding:15px 8px;text-align:center;border-radius:19px;border:1px solid var(--line);background:rgba(255,255,255,.55);box-shadow:var(--sh1)}
.badge .e{color:var(--accent);display:flex;justify-content:center;height:28px;align-items:center}
.badge.lock{opacity:.4;filter:grayscale(1)}.badge.lock .e{color:var(--muted)}
.badge .n{font-size:10.5px;font-weight:700;margin-top:7px;line-height:1.25}

#overlay,#overlay2{position:fixed;inset:0;z-index:100;background:rgba(48,36,74,.44);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s}
#overlay2{z-index:120;background:rgba(48,36,74,.32);align-items:center}
#overlay.on,#overlay2.on{opacity:1;pointer-events:auto}
.modal-shell{width:100%;max-width:440px;max-height:92vh;display:flex;border-radius:32px 32px 0 0;overflow:hidden;filter:drop-shadow(0 -12px 30px rgba(60,40,110,.22));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.84,.28,1)}
.modal-shell-sm{max-width:380px;max-height:88vh;margin:0 12px;border-radius:28px;transform:translateY(40px)}
#overlay.on .modal-shell,#overlay2.on .modal-shell{transform:none}
.modal{flex:1;min-width:0;width:100%;overflow-y:auto;background:linear-gradient(180deg,#FCFBFF,#F2EFFA);padding:10px 20px calc(30px + env(safe-area-inset-bottom))}
.modal-sm{padding-top:24px}
.modal-grab{width:44px;height:5px;border-radius:5px;background:var(--soft);margin:8px auto 16px;opacity:.55}
.modal h3{margin:4px 2px 16px;font-size:21px;font-weight:800;letter-spacing:-.4px;color:var(--c-head)}
.mini{font-size:12px;color:var(--muted);line-height:1.5}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty .e{color:var(--soft);display:flex;justify-content:center;margin-bottom:8px}.empty p{margin:6px 0 4px;font-weight:700;color:var(--ink);font-size:15px}

#toast{position:fixed;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-20px);z-index:200;background:rgba(45,34,70,.96);color:#fff;padding:12px 19px;border-radius:30px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:all .32s;box-shadow:0 14px 36px rgba(0,0,0,.3);max-width:88%;backdrop-filter:blur(8px);display:flex;align-items:center;gap:7px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.pts{background:linear-gradient(135deg,var(--accent3),var(--accent2))}#toast.bad{background:var(--bad)}

.list-row{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:11px}
.list-row .grow{flex:1;min-width:0}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--soft);cursor:pointer;flex:none;display:grid;place-items:center;color:transparent;transition:all .2s}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.strike{text-decoration:line-through;color:var(--muted)}.icon-btn{cursor:pointer;padding:4px;color:var(--muted);display:inline-flex}
.pencil{position:absolute;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 32% 24%,#fff,var(--accent2) 42%,var(--accent) 100%);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 7px 18px rgba(139,111,212,.45),inset 0 2px 4px rgba(255,255,255,.6);z-index:5;transition:transform .15s;border:2.5px solid #fff}
.pencil:active{transform:scale(.86)}
.adm-item{display:flex;align-items:center;gap:11px;padding:11px;border-radius:15px;background:rgba(255,255,255,.6);border:1px solid var(--line);margin-bottom:9px}
.adm-item .pic{width:48px;height:48px}.swatch{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);cursor:pointer;padding:0;background:none}
.sheet-btn{display:flex;align-items:center;gap:13px;width:100%;padding:15px 16px;border-radius:16px;background:rgba(255,255,255,.72);border:1px solid var(--line);margin-bottom:10px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;transition:transform .14s}
.sheet-btn:active{transform:scale(.97)}.sheet-btn .ico{color:var(--accent3);display:inline-flex}.sheet-btn.danger{color:var(--bad)}.sheet-btn.danger .ico{color:var(--bad)}
.photo-box{width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;background:rgba(255,255,255,.5)}
.photo-box img{width:100%;display:block;max-height:240px;object-fit:cover}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.photo-thumb{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.5);aspect-ratio:1;cursor:pointer}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb-dt{position:absolute;left:0;right:0;bottom:0;font-size:9px;font-weight:700;color:#fff;background:linear-gradient(0deg,rgba(30,20,50,.72),transparent);padding:12px 6px 4px;text-align:center;line-height:1.25}
.photo-thumb-actions{position:absolute;top:4px;right:4px;display:flex;gap:4px}
.photo-thumb-actions .icon-btn{background:rgba(30,20,50,.5);color:#fff;border-radius:8px;padding:5px}
.kbd{font-family:ui-monospace,monospace;background:rgba(139,111,212,.13);padding:2px 8px;border-radius:6px;font-weight:700;color:var(--accent3)}
.chart-wrap{overflow:hidden}.chart-wrap svg{width:100%;height:auto;display:block}
.style-btns{display:flex;gap:6px}
.sbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.7);display:grid;place-items:center;cursor:pointer;font-size:15px;font-weight:800;color:var(--muted)}
.sbtn.on{background:var(--accent);color:#fff;border-color:transparent}
.lead-label{font-size:11.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:8px 2px 2px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.title-row .s-title{margin:0}
.pill-add{border-radius:30px;padding:11px 17px;flex:none}
.tile{padding:16px 16px 15px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:transform .12s,box-shadow .12s,filter .12s}
.tile:active{transform:scale(.94);filter:brightness(.97)}
.tile-top{display:flex;align-items:center;justify-content:space-between}
.tile-label{font-size:12.5px;font-weight:600;color:var(--muted)}
.ghost-btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--accent3);background:rgba(110,84,192,.09);border:1px solid var(--line);flex:none}
.tile-num{font-size:33px;font-weight:800;letter-spacing:-1.6px;line-height:1}
.delta{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;align-self:flex-start;background:rgba(110,84,192,.09);color:var(--accent3);display:inline-flex;align-items:center;gap:4px}
.delta.good{background:rgba(107,168,140,.16);color:var(--good)}.delta.warn{background:rgba(201,154,92,.17);color:var(--warn)}.delta.bad{background:rgba(199,126,150,.16);color:var(--bad)}
.hero-card{padding:18px}
.statpill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:22px}
.statpill.good{background:rgba(107,168,140,.18);color:var(--good)}.statpill.warn{background:rgba(201,154,92,.2);color:var(--warn)}.statpill.bad{background:rgba(199,126,150,.18);color:var(--bad)}
.sheet-x{position:absolute;top:13px;right:15px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(120,87,196,.10);color:var(--accent3);display:grid;place-items:center;cursor:pointer;z-index:6;padding:0}.sheet-x:active{transform:scale(.92)}.modal{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;padding-top:30px}.modal-grab{cursor:grab}
.plant-card{position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.plant-card.sel{outline:2.5px solid var(--accent3);outline-offset:-2px;background:rgba(120,87,196,.08)}
.pc-check{position:absolute;top:13px;right:15px;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent3);background:#fff;display:grid;place-items:center;color:transparent;z-index:6}
.pc-check.on{background:var(--accent3);color:#fff;border-color:var(--accent3)}
.selbar-spacer{height:160px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));z-index:120;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);border-radius:24px;box-shadow:0 16px 44px rgba(45,34,70,.22);padding:12px 14px;border:1px solid var(--line)}
.selbar-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.selbar-x{width:34px;height:34px;border:none;border-radius:50%;background:rgba(120,87,196,.10);color:var(--accent3);display:grid;place-items:center;cursor:pointer;padding:0}
.selbar-x:active{transform:scale(.92)}
.selbar-count{flex:1;font-weight:800;color:var(--accent3);font-size:14.5px}
.selbar-actions{display:flex;gap:6px}
.selbar-act{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:rgba(120,87,196,.08);color:var(--accent3);border-radius:14px;padding:10px 2px;cursor:pointer;font-weight:700;font-size:10.5px;line-height:1.1;text-align:center}
.selbar-act:active{transform:scale(.94)}
body.selecting #nav{display:none}
.sortsel{padding:9px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.78);font-size:12.5px;font-weight:700;color:var(--muted);outline:none;max-width:62%}</style>
</head>
<body>
<div id="phone">
  <div id="header">
    <div class="logo-wrap" id="logoTap"><img class="logo-img hidden" id="logoImg" alt=""><span class="logo-txt" id="logoTxt">Josie</span></div>
    <div class="hdr-right"><div class="pill" onclick="J.undo()" id="undoPill" style="display:none"></div><div class="hdr-avatar" onclick="J.show('perfil')" id="hdrAvatar" title="Perfil"></div><div class="pill flame" onclick="J.show('perfil')" id="streakPill"></div></div>
  </div>
  <div id="screen"></div>
  <div id="nav"></div>
</div>
<div id="overlay" onclick="if(event.target===this)J.closeModal()"><div class="modal-shell"><div class="modal" id="modal"></div></div></div>
<div id="overlay2" onclick="if(event.target===this)J.closeModal2()"><div class="modal-shell modal-shell-sm"><div class="modal modal-sm" id="modal2"></div></div></div>
<div id="toast"></div>

/* ===== Persistencia robusta: IndexedDB (gran capacidad) + recuperacion desde localStorage ===== */
const DB_NAME = 'josie_db',
  DB_STORE = 'kv',
  DB_KEY = 'state',
  GARDENS_KEY = 'gardens_registry',
  DEFAULT_GARDEN_ID = 'default';
let _idb = null,
  _idbDead = false;
let gardens = [],
  activeGardenId = DEFAULT_GARDEN_ID;

function idbOpen() {
  return new Promise((res, rej) => {
    if (_idb) return res(_idb);
    if (_idbDead) return rej(new Error('no-idb'));
    let req;
    try {
      req = indexedDB.open(DB_NAME, 1)
    } catch (e) {
      _idbDead = true;
      return rej(e)
    }
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE)
    };
    req.onsuccess = e => {
      _idb = e.target.result;
      _idb.onversionchange = () => {
        try {
          _idb.close()
        } catch (_) {}
        _idb = null
      };
      res(_idb)
    };
    req.onerror = () => {
      _idbDead = true;
      rej(req.error || new Error('idb'))
    }
  })
}

function idbGet(k) {
  return idbOpen().then(db => new Promise((res, rej) => {
    const r = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(k);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error)
  }))
}

function idbSet(k, v) {
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(v, k);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error || new Error('idb-write'));
    tx.onabort = () => rej(tx.error || new Error('idb-abort'))
  }))
}

function idbDel(k) {
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(k);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error || new Error('idb-del'))
  }))
}

/* Cada jardín guarda sus datos bajo su propia clave; el jardín por defecto conserva
   la clave histórica 'state' para no perder los datos de quien actualiza desde una
   versión anterior sin jardines. */
function gardenDbKey(id) {
  return (!id || id === DEFAULT_GARDEN_ID) ? DB_KEY : ('state_' + id)
}

function persistNow() {
  return idbSet(gardenDbKey(activeGardenId), state)
}

async function loadGardens() {
  try {
    const v = await idbGet(GARDENS_KEY);
    if (v && Array.isArray(v.gardens) && v.gardens.length) {
      gardens = v.gardens;
      activeGardenId = (v.activeId && gardens.some(g => g.id === v.activeId)) ? v.activeId : gardens[0].id;
      return
    }
  } catch (e) {}
  try {
    const r = localStorage.getItem('josie_gardens_v1');
    if (r) {
      const v = JSON.parse(r);
      if (v && Array.isArray(v.gardens) && v.gardens.length) {
        gardens = v.gardens;
        activeGardenId = (v.activeId && gardens.some(g => g.id === v.activeId)) ? v.activeId : gardens[0].id;
        return
      }
    }
  } catch (e) {}
  /* Primer arranque, o versión anterior sin jardines: se crea uno por defecto que
     envuelve los datos que ya existían, sin tocarlos ni perder nada. */
  gardens = [{
    id: DEFAULT_GARDEN_ID,
    name: 'Mi jardín',
    icon: 'gCasa'
  }];
  activeGardenId = DEFAULT_GARDEN_ID;
  await saveGardens()
}

async function saveGardens() {
  const payload = {
    gardens: gardens,
    activeId: activeGardenId
  };
  try {
    await idbSet(GARDENS_KEY, payload)
  } catch (e) {}
  try {
    localStorage.setItem('josie_gardens_v1', JSON.stringify(payload))
  } catch (e) {}
}

async function load() {
  const key = gardenDbKey(activeGardenId);
  try {
    const v = await idbGet(key);
    if (v && typeof v === 'object' && Array.isArray(v.plants)) {
      state = v;
      migrate();
      return
    }
  } catch (e) {}
  /* Recuperación desde localStorage si IndexedDB no está disponible, tanto para el
     jardín por defecto como para cualquier otro jardín creado después. */
  try {
    const lsKey = activeGardenId === DEFAULT_GARDEN_ID ? 'josie_v5' : ('josie_v5_' + activeGardenId);
    const r = localStorage.getItem(lsKey);
    if (r) {
      state = JSON.parse(r);
      migrate();
      try {
        await persistNow();
        localStorage.removeItem(lsKey)
      } catch (e) {}
      return
    }
  } catch (e) {}
  if (activeGardenId === DEFAULT_GARDEN_ID) {
    try {
      const old = localStorage.getItem('josie_v4');
      if (old) {
        state = JSON.parse(old);
        state.v = 5;
        migrate();
        try {
          await persistNow();
          localStorage.removeItem('josie_v4')
        } catch (e) {}
        return
      }
    } catch (e) {}
  }
  state = freshState()
}

function migrate() {
  const _fs = freshState();
  if (!state.profile || typeof state.profile !== 'object') state.profile = _fs.profile;
  ['plants', 'tasks', 'incubator', 'cemetery', 'log', 'sales', 'expenses'].forEach(k => {
    if (!Array.isArray(state[k])) state[k] = []
  });
  if (!state.inventory || typeof state.inventory !== 'object') state.inventory = _fs.inventory;
  ['macetas', 'plantas', 'fondos', 'marcos'].forEach(c => {
    if (!Array.isArray(state.inventory[c])) state.inventory[c] = []
  });
  if (!state.shop || typeof state.shop !== 'object') state.shop = _fs.shop;
  if (!state.combos || typeof state.combos !== 'object') state.combos = _fs.combos;
  if (!Array.isArray(state.profile.locations) || !state.profile.locations.length) state.profile.locations = _fs.profile.locations.slice();
  if (!Array.isArray(state.profile.badges)) state.profile.badges = [];
  if (!state.icons) state.icons = [];
  if (!state.counters) state.counters = {
    waterTotal: 0,
    promoTotal: 0,
    legendaryTotal: 0
  };
  if (state.counters.legendaryTotal == null) state.counters.legendaryTotal = 0;
  if (!Array.isArray(state.profile.substrates)) state.profile.substrates = ["Universal", "Sustrato cactus/suculentas", "Aroideas", "Fibra de coco", "Turba", "Drenante / perlita"];
  if (!Array.isArray(state.profile.symptoms)) state.profile.symptoms = SYMPT.map(n => ({ n: n, c: 'warn' }));
  state.profile.symptoms = state.profile.symptoms.map(s => (typeof s === 'string') ? { n: s, c: 'warn' } : { n: s.n, c: s.c || '' });
  if (!Array.isArray(state.profile.healthTags) || !state.profile.healthTags.length) state.profile.healthTags = TAGS.map(t => ({ k: t.k, n: t.n, c: t.c }));
  if (!state.profile.pestTag || typeof state.profile.pestTag !== 'object') state.profile.pestTag = { n: "Plaga detectada", c: "bad" };
  if (typeof state.profile.pestTag.n !== 'string' || !state.profile.pestTag.n) state.profile.pestTag.n = "Plaga detectada";
  if (typeof state.profile.pestTag.c !== 'string') state.profile.pestTag.c = "bad";
  state.plants.forEach(p => {
    if (!p.waterLog) p.waterLog = p.lastWater ? [p.lastWater] : [];
    if (!p.iconId) p.iconId = "base";
    if (p.legendaryCount == null) p.legendaryCount = (p.legendaryClaimed ? 1 : 0);
    if (p.substrate == null) p.substrate = "";
    if (p.forSale == null) p.forSale = false;
    if (p.cost === undefined) p.cost = null;
    if (p.salePrice === undefined) p.salePrice = null;
    /* Historial fotográfico: migra la foto única antigua a un historial, sin perderla */
    if (!Array.isArray(p.photos)) p.photos = [];
    if (p.photo && !p.photos.some(ph => ph && ph.src === p.photo)) {
      p.photos.push({ id: uid(), src: p.photo, ts: p.photos.length ? p.photos[0].ts : (p.acquired ? new Date(p.acquired + 'T12:00').getTime() : Date.now()) })
    }
    p.photos = p.photos.filter(ph => ph && ph.src).map(ph => ({ id: ph.id || uid(), src: ph.src, ts: ph.ts || Date.now() }));
    p.photos.sort((a, b) => a.ts - b.ts);
    if (!p.photo && p.photos.length) p.photo = p.photos[p.photos.length - 1].src;
    /* Historial de plagas */
    if (!Array.isArray(p.pests)) p.pests = []
  });
  (state.sales || []).forEach(s => {
    if (s.price == null) s.price = 0;
    if (s.cost === undefined) s.cost = null;
    if (!s.dateSold) s.dateSold = s.tsSold ? new Date(s.tsSold).toISOString().slice(0, 10) : today();
    if (!s.tsSold) s.tsSold = new Date(s.dateSold + 'T12:00').getTime();
    if (!Array.isArray(s.photos)) s.photos = s.photo ? [{ id: uid(), src: s.photo, ts: s.tsSold }] : []
  });
  (state.incubator || []).forEach(it => {
    if (it.photo === undefined) it.photo = null;
    if (it.substrate == null) it.substrate = ""
  });
  const _ft = _fs.theme;
  state.theme = state.theme || {};
  ["logo", "baseIcon", "incEsqueje", "incSemilla", "appName", "colors", "fonts", "customFonts", "customColors", "text"].forEach(k => {
    if (state.theme[k] == null) state.theme[k] = _ft[k]
  });
  if (typeof state.theme.fonts !== "object") state.theme.fonts = _ft.fonts;
  if (typeof state.theme.colors !== "object") state.theme.colors = _ft.colors;
  if (typeof state.theme.text !== "object") state.theme.text = _ft.text;
  if (!Array.isArray(state.theme.customColors)) state.theme.customColors = [];
  if (!state.profile.lang) state.profile.lang = "es"
}
let _saving = false,
  _pendingSave = false,
  _quotaWarned = false;

function save() {
  if (_saving) {
    _pendingSave = true;
    return
  }
  _saving = true;
  persistNow().then(() => {
    _quotaWarned = false;
    _saving = false;
    if (_pendingSave) {
      _pendingSave = false;
      save()
    }
  }).catch(() => {
    _saving = false;
    let ok = false;
    try {
      localStorage.setItem(activeGardenId === DEFAULT_GARDEN_ID ? 'josie_v5' : ('josie_v5_' + activeGardenId), JSON.stringify(state));
      ok = true
    } catch (e) {}
    if (!ok && !_quotaWarned) {
      _quotaWarned = true;
      try {
        toast("No se pudo guardar. Descarga ya una copia de seguridad.", "bad")
      } catch (e) {}
    }
    if (_pendingSave) {
      _pendingSave = false;
      save()
    }
  })
}
try {
  addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') save()
  });
  addEventListener('pagehide', () => {
    save()
  })
} catch (e) {}

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);

function dShift(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10)
}

function daysSince(s) {
  if (!s) return null;
  return Math.floor((Date.now() - new Date(s + 'T00:00').getTime()) / 86400000)
}

function relDay(s) {
  const d = daysSince(s);
  if (d === null) return "—";
  if (d <= 0) return "hoy";
  if (d === 1) return "ayer";
  return "hace " + d + " días"
}

function fmtDate(s) {
  if (!s) return "—";
  const [y, m, d] = s.split('-');
  return d + "/" + m + "/" + y
}

function esc(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  } [c]))
}

/* Aparición escalonada (stagger) para listas: cada tarjeta llega con un pequeño retardo */
let _stg = 0;

function staggerReset() {
  _stg = 0
}

function stagger(html) {
  const d = Math.min(_stg++, 14) * 30;
  return `<div class="stagger" style="animation-delay:${d}ms">${html}</div>`
}

function sameMonth(s) {
  if (!s) return false;
  return s.slice(0, 7) === today().slice(0, 7)
}

function toast(m, c = "") {
  m = (typeof trMsg === 'function') ? trMsg(m) : m;
  const t = $('#toast');
  t.className = 'on ' + c;
  t.innerHTML = (c === 'pts' ? ic('leaf', 15) : c === 'bad' ? ic('alert', 15) : '') + '<span>' + m + '</span>';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 2000)
}

function gain(n, r) {
  state.profile.xp += n;
  state.log.unshift({
    t: r,
    n,
    d: Date.now()
  });
  state.log = state.log.slice(0, 40);
  toast("+" + n + " XP · " + r, "pts");
  checkLevel();
  syncHeader()
}

function lose(n, r) {
  state.log.unshift({
    t: r,
    n: 0,
    d: Date.now()
  });
  state.log = state.log.slice(0, 40);
  toast(r, "bad");
  syncHeader()
}

function spend(n) {
  if (state.profile.points < n) return false;
  state.profile.points -= n;
  syncHeader();
  return true
}

function levelIndex(xp) {
  let i = 0;
  for (let k = 0; k < RANKS.length; k++)
    if (xp >= RANKS[k].xp) i = k;
  return i
}

function checkLevel() {
  const ni = levelIndex(state.profile.xp),
    old = state.profile.levelIndex || 0;
  if (ni > old) {
    state.log.unshift({
      t: "Subida de nivel a " + RANKS[ni].n,
      n: 0,
      d: Date.now()
    });
    setTimeout(() => toast("¡Nivel " + RANKS[ni].n + "!", "pts"), 650)
  }
  state.profile.levelIndex = ni
}

function syncHeader() {
  const sp = $('#streakPill');
  if (sp) sp.innerHTML = ic('flame', 16) + "<span>" + state.profile.streak + "</span>";
  const av = $('#hdrAvatar');
  if (av) {
    const a = state.profile.avatar;
    av.style.background = a ? `url('${a}') center/cover` : 'linear-gradient(135deg,var(--accent),var(--accent2))';
    av.innerHTML = a ? '' : ic('user', 16)
  }
  if (typeof refreshUndo === "function") refreshUndo()
}

function recomputeBadges() {
  const p = state.profile,
    P = state.plants,
    has = id => p.badges.includes(id),
    give = id => {
      if (!has(id)) {
        p.badges.push(id);
        setTimeout(() => toast("Insignia: " + (BADGES.find(b => b.id === id) || {}).n), 950)
      }
    };
  if (P.length >= 1) give("primera");
  if (P.length >= 10) give("col10");
  if (P.length >= 25) give("col25");
  if (p.maxStreak >= 7) give("racha7");
  if (p.maxStreak >= 30) give("racha30");
  if (P.some(x => x.legendaryClaimed)) give("leg");
  if (state.counters.promoTotal >= 1) give("propagador");
  if (P.some(x => x.flowering)) give("flor");
  if (P.some(x => x.name && x.species && x.light && x.location && x.origin && x.acquired)) give("cientifica");
  if (Object.values(state.inventory).reduce((a, b) => a + b.length, 0) >= 10) give("coleccionista");
  if (p.xp >= 2800) give("botanica");
  if (state.counters.waterTotal >= 100) give("cuidadora")
}

function dailyLogin() {
  const t = today();
  if (state.profile.lastLogin === t) return;
  if (state.profile.lastLogin === dShift(-1)) state.profile.streak += 1;
  else state.profile.streak = 1;
  state.profile.maxStreak = Math.max(state.profile.maxStreak || 0, state.profile.streak);
  state.profile.lastLogin = t;
  gain(PTS.login, "Inicio de sesión diario");
  if (state.profile.streak === 7) gain(PTS.racha7, "Racha de 7 días");
  if (state.profile.streak === 30) gain(PTS.racha30, "Racha de 30 días");
  recomputeBadges();
  save()
}

function shopImg(cat, id) {
  if (!id) return null;
  const it = (state.shop[cat] || []).find(x => x.id === id);
  return it ? it.img : null
}

function baseIcon() {
  return state.theme.baseIcon || CATALOG.base
}

function plantIconSrc(plant) {
  const id = (plant && plant.iconId) || 'base';
  if (id === 'base') return baseIcon();
  const it = (state.icons || []).find(x => x.id === id);
  return it ? it.img : baseIcon()
}

function iconHTML(plant, size) {
  const leg = plant && plant.stage === 'legendaria';
  return `<div class="picon ${leg?'legend':''}" style="width:${size}px;height:${size}px"><img src="${plantIconSrc(plant)}"></div>`
}

function plantHealth(p) {
  let top = 0;
  const tagMap = {};
  getTags().forEach(t => tagMap[t.k] = t.c || '');
  const symMap = {};
  getSympt().forEach(s => symMap[s.n] = s.c || '');
  (p.tags || []).forEach(k => {
    const c = tagMap[k];
    if (c != null && SEV_RANK[c] > top) top = SEV_RANK[c]
  });
  (p.symptoms || []).forEach(n => {
    const c = symMap[n] != null ? symMap[n] : 'warn';
    if (SEV_RANK[c] > top) top = SEV_RANK[c]
  });
  if (top === 3) return 'bad';
  if (top === 2) return 'warn';
  return 'good'
}

function show(k, dir) {
  if (selMode && k !== 'plantas') {
    selMode = false;
    selSet.clear();
    document.body.classList.remove('selecting')
  }
  current = k;
  renderNav();
  syncHeader();
  const hd = $('#header'),
    nv = $('#nav');
  if (hd) hd.style.display = (k === 'jardines') ? 'none' : '';
  if (nv) nv.style.display = (k === 'jardines') ? 'none' : '';
  const s = $('#screen');
  s.classList.remove('anim-up', 'anim-l', 'anim-r');
  void s.offsetWidth;
  ({
    inicio: scrInicio,
    plantas: scrPlantas,
    incubadora: scrIncubadora,
    tienda: scrTienda,
    cementerio: scrCementerio,
    tareas: scrTareas,
    ventas: scrVentas,
    perfil: scrPerfil,
    jardines: scrJardines
  } [k] || scrInicio)();
  s.classList.add(dir === 'l' ? 'anim-l' : dir === 'r' ? 'anim-r' : 'anim-up');
  window.scrollTo(0, 0);
  save()
}

let tx = 0,
  ty = 0;
document.addEventListener('touchstart', e => {
  if (e.target.closest('.filters,.phases,.shop-cats,.tabs,input,textarea,.modal,.chart-wrap')) {
    tx = null;
    return
  }
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY
}, {
  passive: true
});
document.addEventListener('touchend', e => {
  if (tx === null || $('#overlay').classList.contains('on') || $('#overlay2').classList.contains('on')) return;
  const dx = e.changedTouches[0].clientX - tx,
    dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) {
    const i = MAIN.indexOf(current);
    if (i < 0) return;
    if (dx < 0 && i < MAIN.length - 1) show(MAIN[i + 1], 'l');
    else if (dx > 0 && i > 0) show(MAIN[i - 1], 'r')
  }
}, {
  passive: true
});

function tile(label, v, act, delta, dcls) {
  return `<div class="card tile" onclick="${act}" ontouchstart=""><div class="tile-top"><span class="tile-label">${label}</span><span class="ghost-btn">${ic('arrow',14)}</span></div><div class="tile-num">${v}</div>${delta?`<div class="delta ${dcls||''}">${delta}</div>`:''}</div>`
}

function dashChart() {
  const all = [];
  state.plants.forEach(p => (p.waterLog || []).forEach(d => all.push(d)));
  if (all.length < 2) return '';
  all.sort();
  const end = Date.now(),
    nb = 8,
    buckets = new Array(nb).fill(0);
  all.forEach(d => {
    const t = new Date(d + 'T00:00').getTime();
    const wAgo = Math.floor((end - t) / (7 * 86400000));
    const idx = nb - 1 - wAgo;
    if (idx >= 0 && idx < nb) buckets[idx]++
  });
  const max = Math.max(1, ...buckets),
    W = 320,
    H = 126,
    pad = 10,
    bw = (W - pad * 2) / nb;
  let bars = '';
  for (let i = 0; i < nb; i++) {
    const bh = buckets[i] / max * (H - 44),
      x = pad + i * bw + bw * 0.22,
      y = H - 26 - bh,
      w = bw * 0.56,
      hot = i === nb - 1 && buckets[i] > 0;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(bh,3).toFixed(1)}" rx="5" fill="${hot?'url(#hot)':'url(#cool)'}" ${hot?'filter="url(#glow)"':''}/>`;
    if (buckets[i] > 0) bars += `<text x="${(x+w/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10" fill="${hot?'#6A4FBE':'#A99BC8'}" font-weight="${hot?'800':'600'}" text-anchor="middle">${buckets[i]}</text>`;
    bars += `<text x="${(x+w/2).toFixed(1)}" y="${H-8}" font-size="8.5" fill="#A99BC8" text-anchor="middle">S${i+1}</text>`
  }
  const tot = buckets.reduce((a, b) => a + b, 0);
  return `<div class="card" style="margin-bottom:13px"><div class="lead-label" style="margin:0 0 2px">Tu ritmo</div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px"><div style="font-weight:800;font-size:18px;letter-spacing:-.3px">Riegos por semana</div><span class="delta">${tot} en 8 sem.</span></div>
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs>
      <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8B9EE"/><stop offset="1" stop-color="#E6DEF6"/></linearGradient>
      <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9277D6"/><stop offset="1" stop-color="#6A4FBE"/></linearGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <line x1="${pad}" y1="${H-26}" x2="${W-pad}" y2="${H-26}" stroke="#EBE4F7" stroke-width="1"/>${bars}</svg></div></div>`
}

function stat(icon, v, l, cls, act) {
  return `<div class="card stat ${act?'tap':''}" ${act?`onclick="${act}"`:''}><div class="ic">${ic(icon,22)}</div><div class="v" style="${cls==='bad'?'color:var(--bad)':cls==='warn'?'color:var(--warn)':''}">${v}</div><div class="l">${l}</div></div>`
}

function emptyBox(icon, t, s) {
  return `<div class="empty"><div class="e">${ic(icon,46)}</div><p>${t}</p><div class="mini">${s}</div></div>`
}

/* Mis plantas */
let plantFilter = "todas",
  plantSearch = "",
  plantLoc = "",
  plantSort = "",
  _searchTimer = null;

/* Paginación de la lista de plantas: con colecciones grandes (500-1000+ plantas)
   no se construyen todas las tarjetas de golpe, solo se van cargando por tandas. */
const PLANTS_PAGE = 60;
let _plantBlocks = [],
  plantsShown = 0;

/* ===== Selección múltiple (estilo galería) ===== */
let selMode = false,
  selSet = new Set(),
  _holdTimer = null,
  _suppressTap = false,
  _visPlantIds = [];

function cardTap(id) {
  if (_suppressTap) {
    _suppressTap = false;
    return
  }
  if (selMode) toggleSel(id);
  else openPlant(id)
}

function cardHoldStart(id) {
  clearTimeout(_holdTimer);
  _holdTimer = setTimeout(function() {
    _suppressTap = true;
    if (!selMode) selMode = true;
    selSet.add(id);
    if (navigator.vibrate) try {
      navigator.vibrate(15)
    } catch (e) {}
    scrPlantas();
    setTimeout(function() {
      _suppressTap = false
    }, 500)
  }, 420)
}

function cardHoldEnd() {
  clearTimeout(_holdTimer)
}

function patchCardSel(id) {
  const el = document.querySelector('.plant-card[data-id="' + id + '"]');
  if (!el) return;
  const on = selSet.has(id);
  el.classList.toggle('sel', on);
  const chk = el.querySelector('.pc-check');
  if (chk) chk.classList.toggle('on', on)
}

function updateSelChrome() {
  const n = selSet.size;
  const countEl = document.getElementById('selCount');
  if (countEl) countEl.textContent = n + ' seleccionada' + (n === 1 ? '' : 's');
  const allBtn = document.getElementById('selAllBtn');
  if (allBtn) {
    const allSel = _visPlantIds.length > 0 && _visPlantIds.every(id => selSet.has(id));
    allBtn.textContent = allSel ? 'Ninguna' : 'Todas'
  }
}

function toggleSel(id) {
  if (selSet.has(id)) selSet.delete(id);
  else selSet.add(id);
  if (selSet.size === 0) {
    exitSel();
    return
  }
  patchCardSel(id);
  updateSelChrome()
}

function enterSel() {
  selMode = true;
  scrPlantas()
}

function exitSel() {
  selMode = false;
  selSet.clear();
  _suppressTap = false;
  scrPlantas()
}

function selectAllVisible() {
  const allSel = _visPlantIds.length > 0 && _visPlantIds.every(id => selSet.has(id));
  if (allSel) _visPlantIds.forEach(id => selSet.delete(id));
  else _visPlantIds.forEach(id => selSet.add(id));
  if (selSet.size === 0) {
    exitSel();
    return
  }
  _visPlantIds.forEach(patchCardSel);
  updateSelChrome()
}

function batchLocation() {
  const ids = [...selSet];
  if (!ids.length) {
    toast("No has seleccionado nada", "bad");
    return
  }
  const opts = state.profile.locations.map(l => `<div class="sheet-btn" onclick="J.batch('location','${encodeURIComponent(l)}')"><span class="ico">${ic('pin',20)}</span> ${esc(l)}</div>`).join('');
  openModal(`<h3>¿Dónde quieres trasladar las plantas?</h3><div class="mini" style="margin-bottom:14px">${ids.length} planta${ids.length===1?'':'s'} seleccionada${ids.length===1?'':'s'}. Solo cambiará su ubicación; conservarán todos sus demás datos.</div>
  <div class="sheet-btn" onclick="J.batch('location','')"><span class="ico">${ic('ban',20)}</span> Sin ubicación</div>${opts}`)
}

function batch(kind, loc) {
  const ids = [...selSet];
  if (!ids.length) {
    toast("No has seleccionado nada", "bad");
    return
  }
  loc = loc ? decodeURIComponent(loc) : '';
  const t = today();
  let n = 0;
  ids.forEach(id => {
    const p = state.plants.find(x => x.id === id);
    if (!p) return;
    n++;
    if (kind === 'water') {
      p.lastWater = t;
      logWater(p, t);
      state.counters.waterTotal++
    } else if (kind === 'fert') {
      p.lastFert = t
    } else if (kind === 'clean') {
      p.lastClean = t
    } else if (kind === 'review') {
      p.lastReview = t
    } else if (kind === 'transplant') {
      p.lastTransplant = t
    } else if (kind === 'location') {
      p.location = loc || ''
    }
  });
  let xp = 0;
  if (kind === 'water') xp = PTS.regar * n;
  else if (kind === 'fert') xp = PTS.abonar * n;
  else if (kind === 'clean') xp = PTS.limpiar * n;
  const lbl = {
    water: 'Regar',
    fert: 'Abonar',
    clean: 'Limpiar',
    review: 'Revisar',
    transplant: 'Trasplantar'
  } [kind];
  if (xp) {
    state.profile.xp += xp;
    state.log.unshift({
      t: lbl + ' (×' + n + ')',
      n: xp,
      d: Date.now()
    });
    state.log = state.log.slice(0, 40);
    checkLevel();
    syncHeader()
  }
  recomputeBadges();
  save();
  const done = {
    water: 'regadas',
    fert: 'abonadas',
    clean: 'limpiadas',
    review: 'revisadas',
    transplant: 'trasplantadas',
    location: loc ? ('trasladadas a «' + loc + '»') : 'movidas a sin ubicación'
  } [kind];
  selMode = false;
  selSet.clear();
  if (kind === 'location') closeModal();
  else scrPlantas();
  toast(n + ' ' + done + (xp ? (' · +' + xp + ' XP') : ''), xp ? 'pts' : '')
}

const SORT_OPTS = [
  ['', 'Predeterminado'],
  ['az', 'Nombre (A-Z)'],
  ['za', 'Nombre (Z-A)'],
  ['antiguas', 'Más antiguas'],
  ['recientes', 'Más recientes']
];

function selToolbar() {
  if (!state.plants.length) return '';
  const sortSel = `<select class="sortsel" onchange="J.setSort(this.value)">${SORT_OPTS.map(o=>`<option value="${o[0]}" ${plantSort===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
  const btn = selMode ? '' : `<button class="btn btn-soft btn-sm" onclick="J.enterSel()">${ic('check',15)} Seleccionar</button>`;
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-2px 0 10px">${sortSel}${btn}</div>`
}

function selBar() {
  if (!selMode) return '';
  const n = selSet.size;
  const allSel = _visPlantIds.length > 0 && _visPlantIds.every(id => selSet.has(id));
  return `<div class="selbar-spacer"></div><div class="selbar"><div class="selbar-top"><button class="selbar-x" onclick="J.exitSel()">${ic('ban',18)}</button><div class="selbar-count" id="selCount">${n} seleccionada${n===1?'':'s'}</div><button class="btn btn-ghost btn-sm" id="selAllBtn" onclick="J.selectAllVisible()">${allSel?'Ninguna':'Todas'}</button></div><div class="selbar-actions"><button class="selbar-act" onclick="J.batch('water')">${ic('water',20)}<span>Regar</span></button><button class="selbar-act" onclick="J.batch('fert')">${ic('fert',20)}<span>Abonar</span></button><button class="selbar-act" onclick="J.batch('clean')">${ic('brush',20)}<span>Limpiar</span></button><button class="selbar-act" onclick="J.batch('review')">${ic('eye',20)}<span>Revisar</span></button><button class="selbar-act" onclick="J.batch('transplant')">${ic('pot',20)}<span>Trasplante</span></button><button class="selbar-act" onclick="J.batchLocation()">${ic('pin',20)}<span>Ubicación</span></button></div></div>`
}

function applySort(P) {
  if (plantSort === 'az') return P.slice().sort((a, b) => (a.name || '').localeCompare(b.name || '', 'es', {
    sensitivity: 'base'
  }));
  if (plantSort === 'za') return P.slice().sort((a, b) => (b.name || '').localeCompare(a.name || '', 'es', {
    sensitivity: 'base'
  }));
  if (plantSort === 'antiguas') return P.slice().sort((a, b) => (a.acquired || '9999-99-99').localeCompare(b.acquired || '9999-99-99'));
  if (plantSort === 'recientes') return P.slice().sort((a, b) => (b.acquired || '0000-00-00').localeCompare(a.acquired || '0000-00-00'));
  return P
}

function computePlantsBody() {
  let P = state.plants.slice();
  if (plantSearch) P = P.filter(p => (p.name || '').toLowerCase().includes(plantSearch.toLowerCase()));
  if (plantFilter === 'favoritas') P = P.filter(p => p.favorite);
  if (plantFilter === 'riesgo') P = P.filter(p => plantHealth(p) !== 'good');
  if (plantFilter === 'floracion') P = P.filter(p => p.flowering);
  if (plantFilter === 'revhoy') P = P.filter(p => isRevToday(p));
  if (plantFilter === 'sinrevhoy') P = P.filter(p => !isRevToday(p));
  if (plantFilter === 'venta') P = P.filter(p => p.forSale);
  if (plantLoc) P = P.filter(p => (p.location || 'Sin ubicación') === plantLoc);
  P = applySort(P);
  _visPlantIds = P.map(p => p.id);
  if (selSet.size) selSet.forEach(id => {
    if (!state.plants.some(p => p.id === id)) selSet.delete(id)
  });
  if (state.plants.length === 0) return emptyBox('sprout', 'Tu jardín está vacío', 'Añade tu primera planta con el botón +.');
  if (P.length === 0) return emptyBox('search', 'Sin resultados', 'Prueba otro filtro o búsqueda.');
  _plantBlocks = [];
  if (plantSort) {
    P.forEach(p => _plantBlocks.push({ t: 'c', p: p }));
  } else {
    const g = {};
    P.forEach(p => {
      const l = p.location || 'Sin ubicación';
      (g[l] = g[l] || []).push(p)
    });
    Object.keys(g).sort().forEach(l => {
      _plantBlocks.push({ t: 'h', l: l });
      g[l].forEach(p => _plantBlocks.push({ t: 'c', p: p }))
    })
  }
  staggerReset();
  plantsShown = 0;
  return renderPlantBlocksSlice(PLANTS_PAGE)
}

function renderPlantBlocksSlice(count) {
  const start = plantsShown;
  const end = Math.min(_plantBlocks.length, start + count);
  const html = _plantBlocks.slice(start, end).map(b => b.t === 'h' ? `<div class="group-h line">${esc(b.l)}</div>` : stagger(plantCard(b.p))).join('');
  plantsShown = end;
  const left = _plantBlocks.length - plantsShown;
  const moreBtn = left > 0 ? `<button class="btn btn-soft btn-block" id="loadMoreBtn" style="margin:10px 0 4px" onclick="J.loadMorePlants()">${ic('arrow',15)} Cargar más (${left} más)</button>` : '';
  return html + moreBtn
}

function loadMorePlants() {
  const html = renderPlantBlocksSlice(PLANTS_PAGE);
  const btn = document.getElementById('loadMoreBtn');
  if (btn) btn.outerHTML = html;
  else {
    const el = document.getElementById('plantsList');
    if (el) el.insertAdjacentHTML('beforeend', html)
  }
}

function renderPlantsList() {
  const el = document.getElementById('plantsList');
  if (!el) return;
  el.innerHTML = computePlantsBody()
}

function scrPlantas() {
  document.body.classList.toggle('selecting', selMode);
  const body = computePlantsBody();
  const fl = [
    ['todas', 'Todas'],
    ['favoritas', 'Favoritas'],
    ['riesgo', 'En riesgo'],
    ['floracion', 'Floración'],
    ['revhoy', 'Revisadas'],
    ['sinrevhoy', 'Sin revisar'],
    ['venta', 'En venta']
  ];
  $('#screen').innerHTML = `<div class="lead-label">Colección</div><div class="s-title">Mis plantas</div><div class="s-sub">${state.plants.length} en tu colección</div>
  <input class="search" placeholder="Buscar planta..." value="${esc(plantSearch)}" oninput="J.setSearch(this.value)">
  <div class="filters">${fl.map(f=>`<div class="fil ${plantFilter===f[0]?'on':''}" onclick="J.setFilter('${f[0]}')">${f[1]}</div>`).join('')}</div>${(function(){var locs=Array.from(new Set(state.plants.map(p=>p.location||'Sin ubicación')));return locs.length>1?`<div class="filters" style="margin-top:-2px">${[['','Todas las ubicaciones']].concat(locs.map(function(l){return [l,l]})).map(function(f){return `<div class="fil ${plantLoc===f[0]?'on':''}" onclick="J.setLoc('${encodeURIComponent(f[0])}')">${ic('pin',12)} ${esc(f[1])}</div>`
}).join('')
} </div>`:''})()}${selToolbar()}<div id="plantsList">${body}</div>${selBar()}`}

function setSearch(v) {
  plantSearch = v;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(renderPlantsList, 90)
}

function setSort(v) {
  plantSort = v;
  scrPlantas()
}

function setFilter(f) {
  plantFilter = f;
  scrPlantas()
}

function goPlants(f) {
  plantFilter = f || 'todas';
  plantLoc = '';
  show('plantas')
}

function setLoc(v) {
  plantLoc = v ? decodeURIComponent(v) : '';
  scrPlantas()
}

function plantCard(p) {
  const h = plantHealth(p),
    rev = daysSince(p.lastReview);
  return `<div class="card plant-card${selMode&&selSet.has(p.id)?' sel':''}" data-id="${p.id}" onclick="J.cardTap('${p.id}')" ontouchstart="J.cardHoldStart('${p.id}')" ontouchmove="J.cardHoldEnd()" ontouchend="J.cardHoldEnd()" onmousedown="J.cardHoldStart('${p.id}')" onmouseup="J.cardHoldEnd()" onmouseleave="J.cardHoldEnd()" oncontextmenu="return false">${selMode?`<div class="pc-check${selSet.has(p.id)?' on':''}">${ic('check',15)}</div>`:`<div class="pc-actions">
      <span class="${p.favorite?'fav-on':''}" onclick="event.stopPropagation();J.toggleFav('${p.id}')">${ic('star',18,p.favorite?'fill':'')}</span>
      <span onclick="event.stopPropagation();J.plantMenu('${p.id}')">${ic('dots',18)}</span></div>`}
    <div class="pic">${iconHTML(p,64)}</div>
    <div class="pc-body"><div class="pc-name">${esc(p.name||'Sin nombre')} ${p.stage==='legendaria'?`<span class="chip gold">${ic('crown',12)}</span>`:''}${p.fromProp?`<span class="chip">${ic(p.fromProp==='esqueje'?'scissors':'seed',11)} ${p.fromProp==='esqueje'?'Esqueje':'Semilla'}</span>`:''}</div>
      <div class="pc-meta"><span>${ic('water',13)} ${relDay(p.lastWater)}</span>${p.location?`<span>${ic('pin',12)} ${esc(p.location)}</span>`:''}</div>
      <div class="pc-meta" style="margin-top:7px"><span class="chip ${h}">${h==='good'?'Sana':h==='warn'?'Atención':'En riesgo'}</span>${p.flowering?`<span class="chip warn">Floración</span>`:''}${p.forSale?`<span class="chip">${ic('bag',11)} En venta</span>`:''}${(function(){var ap=(p.tags||[]).includes('plaga')?activePest(p):null;return ap?`<span class="chip bad">${ic('bug',11)} ${esc(ap.name)}</span>`:''})()}${isRevToday(p)?`<span class="chip good">${ic('eye',11)} Revisada</span>`:((rev===null||rev>7)?`<span class="chip">Revisar</span>`:'')}</div></div></div>`
}

function toggleFav(id) {
  const p = state.plants.find(x => x.id === id);
  if (!p) return;
  p.favorite = !p.favorite;
  save();
  /* Se actualiza solo la tarjeta afectada: con colecciones grandes evita reconstruir
     toda la lista (y perder la posición de scroll o la paginación cargada) */
  const el = document.querySelector('.plant-card[data-id="' + id + '"]');
  if (el) el.outerHTML = plantCard(p);
  else scrPlantas()
}

function plantMenu(id) {
  const p = state.plants.find(x => x.id === id);
  openModal(`<h3>${esc(p.name||'Planta')}</h3>
  <div class="sheet-btn" onclick="J.closeModal();J.openPlant('${id}')"><span class="ico">${ic('eye',20)}</span> Abrir ficha</div>
  <div class="sheet-btn" onclick="J.closeModal();J.openPlantForm('${id}')"><span class="ico">${ic('pencil',20)}</span> Editar</div>
  <div class="sheet-btn" onclick="J.closeModal();J.killPlant('${id}')"><span class="ico">${ic('grave',20)}</span> Mover al cementerio</div>
  <div class="sheet-btn danger" onclick="J.closeModal();J.deletePlant('${id}')"><span class="ico">${ic('trash',20)}</span> Eliminar definitivamente</div>`)
}

/* Ficha */
let fichaTab = "identidad";
let _lastFichaId = null;
let _fichaScrollReset = true;

function openPlant(id) {
  fichaTab = "identidad";
  _fichaScrollReset = true;
  renderFicha(id)
}

function renderFicha(id) {
  const p = state.plants.find(x => x.id === id);
  if (!p) return show('plantas');
  _lastFichaId = id;
  const content = fichaTab === 'identidad' ? fichaIdentidad(p) : fichaTab === 'estado' ? fichaEstado(p) : fichaTab === 'plagas' ? fichaPlagas(p) : fichaFase(p);

  const wasOpen = $('#overlay').classList.contains('on');
  const prevScroll = modalEl ? modalEl.scrollTop : 0;
  modalEl.innerHTML = '<div class="modal-grab"></div><button class="sheet-x" onclick="J.closeModal()" aria-label="Cerrar">' + ic('x', 19) + '</button>' + `<div style="position:relative;text-align:center;margin-bottom:4px"><div style="display:inline-block">${iconHTML(p,118)}</div>
      <div class="pencil" style="right:calc(50% - 76px);top:82px" onclick="J.openIconPicker('${p.id}')">${ic('brush',18)}</div></div>
    <h3 style="text-align:center;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:7px">${esc(p.name||'Sin nombre')} ${p.favorite?`<span style="color:var(--gold)">${ic('star',16,'fill')}</span>`:''}</h3>
    <div class="tabs">${['identidad','estado','plagas','fase'].map(t=>`<div class="tab ${fichaTab===t?'on':''}" onclick="J.fichaTabSet('${id}','${t}')">${({identidad:'Identidad',estado:'Estado',plagas:'Plagas',fase:'Fase vital'})[t]}</div>`).join('')}</div>${content}
    <div class="row" style="margin-top:18px"><button class="btn btn-soft" onclick="J.openPlantForm('${p.id}')">${ic('pencil',16)} Editar</button><button class="btn btn-bad" onclick="J.killPlant('${p.id}')">${ic('grave',16)} Cementerio</button></div>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;color:var(--bad)" onclick="J.deletePlant('${p.id}')">${ic('trash',16)} Eliminar definitivamente</button>`;
  $('#overlay').classList.add('on');

  modalEl.scrollTop = (_fichaScrollReset || !wasOpen) ? 0 : prevScroll;
  _fichaScrollReset = false
}

function fichaTabSet(id, t) {
  fichaTab = t;
  _fichaScrollReset = true;
  renderFicha(id)

function fichaIdentidad(p) {
  const f = (l, v) => `<div class="field"><label>${l}</label><div class="val">${v||'—'}</div></div>`;
  return `${photoHistorySection(p)}
    <div class="grid2">${f('Ubicación',esc(p.location))}${f('Origen',esc(p.origin))}</div><div class="grid2">${f('Adquisición',fmtDate(p.acquired))}${f('Sustrato',esc(p.substrate))}</div>
    <div class="field"><label>Precio de compra (€)</label><input type="number" min="0" step="0.01" class="inp" value="${p.cost!=null?p.cost:''}" placeholder="0.00" onchange="J.setPlantCost('${p.id}',this.value)"></div>
    ${p.forSale?`<div class="chip" style="margin:-4px 0 12px">${ic('bag',13)} En venta</div>`:''}
    ${p.notes?`<div class="field"><label>Notas</label><div class="val" style="font-weight:500">${esc(p.notes)}</div></div>`:''}`
}

function setPlantCost(id, v) {
  const p = state.plants.find(x => x.id === id);
  if (!p) return;
  const n = parseFloat(v);
  p.cost = (v === '' || !isFinite(n)) ? null : n;
  save()
}

/* ===== Historial fotográfico de crecimiento ===== */
function fmtDateTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const dd = d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });

  return `${dd} · ${hh}`
}

function addPhoto(id) {

    const p = state.plants.find(x => x.id === id);
    if (!p) return;
    if (!Array.isArray(p.photos)) p.photos = [];
    const entry = { id: uid(), src: d, ts: Date.now() };

    save();
    renderFicha(id);
    toast("Foto añadida")
  })
}

function removePhoto(id, photoId) {
  const p = state.plants.find(x => x.id === id);
  if (!p) return;
  if (!photoId) {
    p.photo = null;
    save();
    renderFicha(id);
    return
  }
  confirmModal("Eliminar fotografía", "¿Eliminar esta fotografía del historial? No se puede deshacer.", () => {
    p.photos = (p.photos || []).filter(ph => ph.id !== photoId);
    const sorted = p.photos.slice().sort((a, b) => b.ts - a.ts);
    p.photo = sorted.length ? sorted[0].src : null;
    save();
    closeModal2();
    renderFicha(id);

  }, true)
}

function downloadPhoto(id, photoId) {
  const p = state.plants.find(x => x.id === id);
  const ph = p && (p.photos || []).find(x => x.id === photoId);
  if (!ph) return;
  try {
    const a = document.createElement('a');
    a.href = ph.src;
    const ext = (ph.src.split(';')[0].split('/')[1] || 'jpg').replace('jpeg', 'jpg');
    const dt = new Date(ph.ts).toISOString().slice(0, 10);
    a.download = (p.name || 'planta').replace(/[^a-z0-9áéíóúñ_-]+/gi, '_') + '-' + dt + '.' + ext;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 700)
  } catch (e) {
    toast("No se pudo descargar", "bad")
  }
}

function viewPhoto(id, photoId) {

  return null
}

  return `<div class="field"><label>${esc(pt.n)}</label>
    <div class="tagrow">${ap?`<span class="chip ${pt.c||'bad'}">${ic('bug',12)} ${esc(ap.name)}</span>`:`<span class="mini">Sin plaga concreta indicada</span>`}
    <button class="btn btn-soft btn-sm" onclick="J.addPest('${p.id}')">${ic('plus',13)} ${ap?'Registrar otra':'Indicar plaga'}</button></div></div>`

function addPest(id) {

  inputModal("Registrar plaga", [{
    id: 'name',

  }, {

    value: today()
  }], v => {
    if (!v.name) return;

function waterChart(p) {
  const log = (p.waterLog || []).slice().filter(Boolean).sort();
  if (log.length < 1) return `<div class="mini" style="padding:6px 0">Riega la planta para empezar a ver su historial.</div>`;
  const start = (p.acquired && p.acquired < log[0]) ? p.acquired : log[0],
    startMs = new Date(start + 'T00:00').getTime(),
    end = Date.now();
  const weeksTotal = Math.max(1, Math.ceil((end - startMs) / (7 * 86400000))),
    nb = Math.min(weeksTotal, 8),
    buckets = new Array(nb).fill(0);
  log.forEach(d => {
    const t = new Date(d + 'T00:00').getTime();
    const wAgo = Math.floor((end - t) / (7 * 86400000));
    const idx = nb - 1 - wAgo;
    if (idx >= 0 && idx < nb) buckets[idx]++
  });
  const max = Math.max(1, ...buckets),
    W = 300,
    H = 96,
    pad = 6,
    bw = (W - pad * 2) / nb;
  let bars = "";
  for (let i = 0; i < nb; i++) {
    const bh = buckets[i] / max * (H - 34),
      x = pad + i * bw + bw * 0.18,
      y = H - 18 - bh,
      w = bw * 0.64,
      ly = Math.max(y - 4, 11),
      hot = i === nb - 1 && buckets[i] > 0;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(bh,2).toFixed(1)}" rx="4" fill="${hot?'url(#whot)':'url(#wcool)'}" ${hot?'filter="url(#wglow)"':''}/>`;
    if (buckets[i] > 0) bars += `<text x="${(x+w/2).toFixed(1)}" y="${ly.toFixed(1)}" font-size="9" fill="${hot?'#6A4FBE':'#A99BC8'}" font-weight="${hot?'800':'600'}" text-anchor="middle">${buckets[i]}</text>`;
    bars += `<text x="${(x+w/2).toFixed(1)}" y="${H-4}" font-size="8" fill="#A99BC8" text-anchor="middle">S${i+1}</text>`
  }
  let inter = [];
  for (let i = 1; i < log.length; i++) inter.push((new Date(log[i]) - new Date(log[i - 1])) / 86400000);
  const avg = inter.length ? (inter.reduce((a, b) => a + b, 0) / inter.length) : null;
  let trend = "";
  if (inter.length >= 2) {
    const h = Math.ceil(inter.length / 2),
      a1 = inter.slice(0, h),
      a2 = inter.slice(h),
      m1 = a1.reduce((a, b) => a + b, 0) / a1.length,
      m2 = a2.reduce((a, b) => a + b, 0) / a2.length;
    trend = m2 < m1 - 0.6 ? 'Últimamente riegas con más frecuencia' : m2 > m1 + 0.6 ? 'Estás espaciando más los riegos' : 'Ritmo de riego estable'
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs>
    <linearGradient id="wcool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8B9EE"/><stop offset="1" stop-color="#E6DEF6"/></linearGradient>
    <linearGradient id="whot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9277D6"/><stop offset="1" stop-color="#6A4FBE"/></linearGradient>
    <filter id="wglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <line x1="${pad}" y1="${H-18}" x2="${W-pad}" y2="${H-18}" stroke="#EBE4F7" stroke-width="1"/>${bars}</svg>
    <div class="mini" style="margin-top:6px">${log.length} riegos · ${avg!=null?`cada ~${avg.toFixed(1)} días`:'sigue regando para ver la media'}${trend?` · <b style="color:var(--accent3)">${trend}</b>`:''}</div>`
}

function logWater(p, date) {
  p.waterLog = p.waterLog || [];
  if (!p.waterLog.includes(date)) p.waterLog.push(date)
}

  const p = state.plants.find(x => x.id === id);
  p.lastWater = today();
  logWater(p, today());
  state.counters.waterTotal++;
  gain(PTS.regar, "Regar planta");
  recomputeBadges();
  save();
  renderFicha(id)
}

  p.lastWater = v;

  p.waterLog = (p.waterLog || []).sort();
  save();
  renderFicha(id)
}

  }

function setFert(id, v) {

  save();
  renderFicha(id)
}

function transplant(id) {
  const p = state.plants.find(x => x.id === id);

  save();
  renderFicha(id)
}

function setTransplant(id, v) {

  p.lastTransplant = v;
  save();
  renderFicha(id)
}

function setClean(id, v) {
  const p = state.plants.find(x => x.id === id);
  p.lastClean = v;
  save();
  renderFicha(id)
}

  if (!p) return;
  p.forSale = !p.forSale;
  save();
  renderFicha(id)
}

function setSubstrate(id, v) {
  const p = state.plants.find(x => x.id === id);
  if (!p) return;
  if (v === '__new') {
    inputModal("Nuevo sustrato", [{
      id: 'sub',
      label: 'Nombre',
      placeholder: 'Ej: Akadama'
    }], val => {
      if (val.sub) {
        if (getSubs().indexOf(val.sub) < 0) state.profile.substrates.push(val.sub);
        p.substrate = val.sub;
        save()
      }
      renderFicha(id)
    });
    return
  }

function toggleFlower(id) {

  save();

}

function toggleTag(id, k) {
  const p = state.plants.find(x => x.id === id);
  p.tags = p.tags || [];
  const i = p.tags.indexOf(k);
  i < 0 ? p.tags.push(k) : p.tags.splice(i, 1);

  save();
  renderFicha(id)

function toggleSympt(id, s) {

  i < 0 ? p.symptoms.push(s) : p.symptoms.splice(i, 1);
  save();
  renderFicha(id)
}

function toggleSymptAt(id, idx) {

  toggleSympt(id, s.n)
}

}

function setPhase(id, k) {
  const p = state.plants.find(x => x.id === id);
  const wasLeg = p.stage === 'legendaria';
  p.stage = k;
  if (k === 'legendaria' && !wasLeg) {
    p.legendaryCount = (p.legendaryCount || 0) + 1;
    state.counters.legendaryTotal = (state.counters.legendaryTotal || 0) + 1;
    p.legendaryClaimed = true;
    gain(PTS.legendaria, "¡Planta legendaria!");
    recomputeBadges()
  }
  save();
  renderFicha(id)
}

  if (i < 0) {
    closeModal();
    return
  }
  const p = state.plants[i];
  const _kr = $('#kreason');
  state.cemetery.unshift({
    id: uid(),
    name: p.name,
    reason: ((_kr && _kr.value) || '—'),
    born: p.acquired,
    died: today(),
    iconId: p.iconId || 'base',
    stage: p.stage,
    photo: p.photo,
    photos: p.photos || []
  });
  state.plants.splice(i, 1);

  toast("Movida al cementerio");
  show('plantas')
}

/* Incubadora */
function incIcon(it) {
  if (it.photo) return `<img src="${it.photo}">`;
  const ov = it.type === 'esqueje' ? state.theme.incEsqueje : state.theme.incSemilla;
  if (ov) return `<img src="${ov}">`;
  return `<span style="color:${it.type==='esqueje'?'var(--accent3)':'var(--good)'}">${ic(it.type==='esqueje'?'scissors':'seed',30)}</span>`
}

function scrIncubadora() {
  const I = state.incubator;
  staggerReset();
  $('#screen').innerHTML = `<div class="lead-label">Propagación</div><div class="s-title">Incubadora</div><div class="s-sub">${I.length} propagaciones en curso</div>${I.length?I.map(it=>stagger(incCard(it))).join(''):emptyBox('flask','Incubadora vacía','Añade un esqueje o una semilla con el botón +.')}`
}

function incCard(it) {
  const stages = it.type === 'esqueje' ? ['Cortado', 'Enraizando', 'Listo'] : ['Sembrada', 'Germinada', 'Enraizando', 'Lista'];
  const idx = Math.min(it.stage || 0, stages.length - 1),
    pct = Math.round(idx / (stages.length - 1) * 100);
  return `<div class="card inc-card" onclick="J.openInc('${it.id}')"><div class="inc-ic">${incIcon(it)}</div><div style="flex:1;min-width:0"><div style="font-weight:800">${esc(it.name)}</div>
    <div class="mini" style="display:flex;align-items:center;gap:5px">${ic(it.type==='esqueje'?'scissors':'seed',12)} ${it.type==='esqueje'?'Esqueje':'Semilla'} · ${relDay(it.start)} · raíz ~${it.root||0} cm</div>${it.origin?`<div class="mini" style="display:flex;align-items:center;gap:5px;margin-top:2px">${ic('pin',11)} ${esc(it.origin)}</div>`:''}${it.substrate?`<div class="mini" style="display:flex;align-items:center;gap:5px;margin-top:2px">${ic('pot',11)} ${esc(it.substrate)}</div>`:''}
    <div class="mini" style="margin-top:3px;color:var(--accent3);font-weight:700">${stages[idx]}</div><div class="progress"><i style="width:${pct}%"></i></div></div></div>`
}

function openInc(id) {
  const it = state.incubator.find(x => x.id === id),
    stages = it.type === 'esqueje' ? ['Cortado', 'Enraizando', 'Listo'] : ['Sembrada', 'Germinada', 'Enraizando', 'Lista'];
  const subOpts = '<option value="" ' + (it.substrate ? '' : 'selected') + '>Sin especificar</option>' + getSubs().map(su => `<option ${it.substrate===su?'selected':''}>${esc(su)}</option>`).join('') + ((it.substrate && getSubs().indexOf(it.substrate) < 0) ? `<option selected>${esc(it.substrate)}</option>` : '') + '<option value="__new">+ Nuevo...</option>';
  openModal(`<h3 style="display:flex;align-items:center;gap:8px">${ic(it.type==='esqueje'?'scissors':'seed',20)} ${esc(it.name)}</h3>
    ${it.photo?`<div class="photo-box"><img src="${it.photo}"></div><div class="row" style="margin-bottom:14px"><button class="btn btn-soft btn-sm" onclick="J.incPhoto('${id}')">${ic('camera',15)} Cambiar imagen</button><button class="btn btn-bad btn-sm" onclick="J.incRemovePhoto('${id}')">${ic('trash',15)} Quitar</button></div>`:`<button class="btn btn-soft btn-block" style="margin-bottom:14px" onclick="J.incPhoto('${id}')">${ic('camera',16)} Adjuntar imagen para identificarla</button>`}
    <div class="field"><label>Estado</label><div class="phases">${stages.map((s,i)=>`<div class="phase ${(it.stage||0)===i?'on':''}" onclick="J.setIncStage('${id}',${i})"><div class="n">${s}</div></div>`).join('')}</div></div>
    <div class="field"><label>Longitud de raíz (cm)</label><input type="number" class="inp" value="${it.root||0}" oninput="J.setIncRoot('${id}',this.value)"></div>
    <div class="field"><label>Sustrato</label><select class="inp" onchange="J.setIncSub('${id}',this.value)">${subOpts}</select></div>
    <button class="btn btn-primary btn-block" style="margin-bottom:8px" onclick="J.promote('${id}')">${ic('sprout',16)} Promocionar a planta · +${PTS.promo}</button>
    <div class="row"><button class="btn btn-bad" onclick="J.incDie('${id}')">${ic('skull',16)} Murió · -${PTS.muerte}</button><button class="btn btn-ghost" onclick="J.incDelete('${id}')">${ic('trash',16)} Quitar</button></div>`)
